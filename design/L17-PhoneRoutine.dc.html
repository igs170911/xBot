<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<title>手機：一句話建立定時任務</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;font-synthesis:none;background:#070707}
a{color:#7FC0FF;text-decoration:none}a:hover{color:#A8D4FF}
button{font:inherit}
textarea::placeholder{color:#FCFCFC90}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #070707; color: #FCFCFC; font-family: 'Huninn', 'PingFang TC', 'Noto Sans TC', sans-serif; font-size: 15px; line-height: 1.45; display: flex; flex-direction: column">
<div aria-hidden="true" style="height: 47px; flex: none"></div>

<header style="flex: none; height: 56px; display: flex; align-items: center; gap: 8px; padding: 0 16px 0 12px">
<a href="L16-PhoneCalendar.dc.html" aria-label="返回行事曆" style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 999px; background: #191919; border: 1px solid #333333; color: #FCFCFC; display: flex; align-items: center; justify-content: center; flex: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: block"><path d="m15 18-6-6 6-6"></path></svg></a>
<h1 style="margin: 0; flex: 1; min-width: 0; font-size: 17px; font-weight: 400; white-space: nowrap">定時任務</h1>
<span style="height: 24px; display: inline-flex; align-items: center; gap: 4px; padding: 0 9px; border-radius: 999px; background: rgba(16,132,254,.2); color: #7FC0FF; font-size: 12px; white-space: nowrap; flex: none"><span style="display: flex"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: block"><path d="{{I.sparkles}}"></path></svg></span>簡化：15 個欄位 → 1 句話＋確認</span>
</header>

<div style="flex: 1; min-height: 0; overflow: hidden; padding: 4px 16px 0; display: flex; flex-direction: column; gap: 10px">

<label style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13.5px; color: #FCFCFC99">用一句話說：什麼時候、誰、做什麼</span>
<span style="position: relative; display: flex">
<textarea rows="2" placeholder="例：每週一早上 8 點把週報寄給我" style="width: 100%; height: 72px; box-sizing: border-box; resize: none; padding: 12px 56px 12px 14px; border: 1px solid #333333; border-radius: 14px; background: #191919; color: #FCFCFC; font: inherit; font-size: 16px; line-height: 1.5; outline: none">每天早上 9 點整理新聞給我</textarea>
<button type="button" aria-label="用說的" style="position: absolute; right: 6px; top: 14px; width: 44px; height: 44px; border: 0; border-radius: 999px; background: transparent; color: #FCFCFC99; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: block"><path d="{{I.mic}}"></path></svg></button>
</span>
</label>

<section aria-labelledby="parsed-title" style="background: #262626; border-radius: 18px; padding: 12px 16px 6px; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; gap: 8px; padding-bottom: 6px">
<span style="color: #7FC0FF; display: flex"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: block"><path d="{{I.sparkles}}"></path></svg></span>
<h2 id="parsed-title" style="margin: 0; flex: 1; font-size: 15px; font-weight: 400">系統這樣理解</h2>
<span style="font-size: 12.5px; color: #FCFCFC90">點一下可以改</span>
</div>

<button type="button" aria-haspopup="listbox" style="height: 48px; display: flex; align-items: center; gap: 12px; padding: 0; border: 0; border-top: 1px solid #333333; background: transparent; color: #FCFCFC; text-align: left; cursor: pointer">
<span style="width: 72px; flex: none; font-size: 13.5px; color: #FCFCFC99">誰做</span>
<span style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; font-size: 15px"><dc-import name="Avatar" color="blue" body="cursor" state="{{face}}" dot="none" ring="#262626" size="24" hint-size="24px,24px"></dc-import>小秘<span style="font-size: 13px; color: #FCFCFC99">幕僚長</span></span>
<span style="color: #FCFCFC90; display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: block"><path d="m6 9 6 6 6-6"></path></svg></span>
</button>
<button type="button" aria-haspopup="listbox" style="height: 48px; display: flex; align-items: center; gap: 12px; padding: 0; border: 0; border-top: 1px solid #333333; background: transparent; color: #FCFCFC; text-align: left; cursor: pointer">
<span style="width: 72px; flex: none; font-size: 13.5px; color: #FCFCFC99">什麼時候</span>
<span style="flex: 1; min-width: 0; font-size: 15px">每天 上午 9:00</span>
<span style="color: #FCFCFC90; display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: block"><path d="m6 9 6 6 6-6"></path></svg></span>
</button>
<button type="button" aria-haspopup="listbox" style="height: 48px; display: flex; align-items: center; gap: 12px; padding: 0; border: 0; border-top: 1px solid #333333; background: transparent; color: #FCFCFC; text-align: left; cursor: pointer">
<span style="width: 72px; flex: none; font-size: 13.5px; color: #FCFCFC99">做什麼</span>
<span style="flex: 1; min-width: 0; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">整理今天的新聞重點，約 8 行</span>
<span style="color: #FCFCFC90; display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: block"><path d="m6 9 6 6 6-6"></path></svg></span>
</button>
<button type="button" aria-haspopup="listbox" style="height: 48px; display: flex; align-items: center; gap: 12px; padding: 0; border: 0; border-top: 1px solid #333333; background: transparent; color: #FCFCFC; text-align: left; cursor: pointer">
<span style="width: 72px; flex: none; font-size: 13.5px; color: #FCFCFC99">結果貼到</span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.3"><span style="font-size: 15px">和小秘的對話</span><span style="font-size: 12.5px; color: #FCFCFC99">新對話串「每日新聞」</span></span>
<span style="color: #FCFCFC90; display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: block"><path d="m6 9 6 6 6-6"></path></svg></span>
</button>
<div style="height: 48px; display: flex; align-items: center; gap: 12px; border-top: 1px solid #333333">
<span style="width: 72px; flex: none; font-size: 13.5px; color: #FCFCFC99">下次執行</span>
<span style="flex: 1; min-width: 0; font-size: 15px">明天 10 月 18 日（日）上午 9:00</span>
</div>
</section>

<div style="display: flex; flex-direction: column; background: #111111; border-radius: 16px; padding: 0 16px">
<button type="button" onClick="{{toggleAdv}}" aria-expanded="{{advA}}" style="height: 52px; display: flex; align-items: center; gap: 10px; padding: 0; border: 0; background: transparent; color: #FCFCFC; text-align: left; cursor: pointer">
<span style="color: #FCFCFC99; display: flex; transform: rotate({{advRot}})"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: block"><path d="m9 18 6-6-6-6"></path></svg></span>
<span style="font-size: 15px">進階設定</span>
<span style="flex: 1; min-width: 0; text-align: right; font-size: 12.5px; color: #FCFCFC90; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{advHint}}</span>
</button>
<sc-if value="{{adv}}" hint-placeholder-val="{{ false }}">
<div style="height: 48px; display: flex; align-items: center; gap: 12px; border-top: 1px solid #262626">
<span style="flex: 1; font-size: 14.5px">隨機延後</span>
<button type="button" aria-haspopup="listbox" style="height: 40px; min-width: 120px; padding: 0 10px 0 12px; box-sizing: border-box; border: 1px solid #333333; border-radius: 10px; background: #191919; color: #FCFCFC; font-size: 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px; cursor: pointer">不延後<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FCFCFC99" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: block"><path d="m6 9 6 6 6-6"></path></svg></button>
</div>
<div style="height: 48px; display: flex; align-items: center; gap: 12px; border-top: 1px solid #262626">
<span style="flex: 1; display: flex; flex-direction: column; line-height: 1.3"><span style="font-size: 14.5px">做到完成為止</span><span style="font-size: 12px; color: #FCFCFC90">目標型 · 預設 10 輪</span></span>
<button type="button" role="switch" aria-checked="false" aria-label="做到完成為止" style="width: 40px; height: 24px; flex: none; border: 0; padding: 0; border-radius: 999px; position: relative; cursor: pointer; background: #3D3D3D"><span style="position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #FFFFFF"></span></button>
</div>
<div style="height: 48px; display: flex; align-items: center; gap: 12px; border-top: 1px solid #262626">
<span style="flex: 1; font-size: 14.5px">沒跑成功時通知我</span>
<button type="button" role="switch" aria-checked="true" aria-label="沒跑成功時通知我" style="width: 40px; height: 24px; flex: none; border: 0; padding: 0; border-radius: 999px; position: relative; cursor: pointer; background: #1084FE"><span style="position: absolute; top: 3px; left: 19px; width: 18px; height: 18px; border-radius: 50%; background: #FFFFFF"></span></button>
</div>
</sc-if>
</div>

</div>

<div style="flex: none; padding: 12px 16px 34px; display: flex; flex-direction: column; gap: 8px">
<sc-if value="{{open}}" hint-placeholder-val="{{ true }}">
<button type="button" onClick="{{create}}" style="height: 50px; border: 0; border-radius: 999px; background: #FCFCFC; color: #070707; font-size: 16px; cursor: pointer">建立</button>
<p style="margin: 0; height: 20px; text-align: center; font-size: 12.5px; color: #FCFCFC90">建立後隨時能在行事曆改時間或暫停</p>
</sc-if>
<sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
<div role="status" style="height: 28px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14.5px; color: #38D591"><span style="display: flex"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: block"><path d="{{I.circleCheck}}"></path></svg></span>已建立 · 小秘明天上午 9:00 第一次跑</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<a href="L16-PhoneCalendar.dc.html" style="height: 50px; border-radius: 999px; background: #FCFCFC; color: #070707; font-size: 15.5px; display: flex; align-items: center; justify-content: center">看行事曆</a>
<button type="button" onClick="{{undo}}" style="height: 50px; border: 1px solid #333333; border-radius: 999px; background: transparent; color: #FCFCFC; font-size: 15.5px; cursor: pointer">復原</button>
</div>
</sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const J = (a) => a.map((d) => (d[0] === 'm' ? 'M0 0' + d : d)).join(' ');
const I = {
sparkles: J(['M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z', 'M20 2v4', 'M22 4h-4', 'M2 20a2 2 0 1 0 4 0a2 2 0 1 0 -4 0']),
mic: J(['M12 19v3', 'M19 10v2a7 7 0 0 1-14 0v-2', 'M12 2h0a3 3 0 0 1 3 3v7a3 3 0 0 1 -3 3h0a3 3 0 0 1 -3 -3v-7a3 3 0 0 1 3 -3Z']),
circleCheck: J(['M2 12a10 10 0 1 0 20 0a10 10 0 1 0 -20 0', 'm16 9-5.5 5.5L8 12'])
};
const st = this.state || {};
const adv = !!st.adv, done = !!st.done;
return {
I, adv, done, open: !done,
advA: adv ? 'true' : 'false',
advRot: adv ? '90deg' : '0deg',
advHint: adv ? '' : '隨機延後、目標型、失敗通知',
face: done ? 'happy' : 'idle',
toggleAdv: () => this.setState({ adv: !adv }),
create: () => this.setState({ done: true, adv: false }),
undo: () => this.setState({ done: false })
};
}
}
</script>
</body>
</html>
