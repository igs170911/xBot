<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<title>側欄與選單</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;font-synthesis:none;background:#070707}
h1,h2,h3{font-weight:400}
a{color:#7FC0FF;text-decoration:none}
</style>
</helmet>
<div style="position: relative; min-height: 960px; display: flex; flex-wrap: wrap; background: #070707; color: #FCFCFC; font-family: 'Huninn', 'PingFang TC', 'Noto Sans TC', sans-serif; font-size: 14.5px; line-height: 1.5">

<div style="flex: 1 1 300px; max-width: 100%; border-right: 1px solid #1C1C1C; background: #111111">
<dc-import name="Sidebar" active="azhe" hint-size="100%,960px"></dc-import>
</div>

<div role="menu" aria-label="阿哲的選單" style="position: absolute; left: 150px; top: 500px; width: 272px; box-sizing: border-box; background: #262626; border-radius: 12px; padding: 6px; display: flex; flex-direction: column; box-shadow: 0 12px 32px rgba(0,0,0,.5); z-index: 2">
<sc-for list="{{botMenu}}" as="m" hint-placeholder-count="12">
<sc-if value="{{m.sep}}" hint-placeholder-val="{{ false }}"><span style="height: 1px; background: #333333; margin: 4px 6px"></span></sc-if>
<sc-if value="{{m.item}}" hint-placeholder-val="{{ true }}">
<button type="button" role="menuitem" style="display: flex; align-items: center; gap: 12px; min-height: 34px; padding: 0 10px; border: 0; border-radius: 8px; background: {{m.bg}}; color: {{m.c}}; font: inherit; font-size: 14px; text-align: left; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; opacity: {{m.io}}"><path d="{{m.icon}}"></path></svg>
<span style="flex: 1">{{m.t}}</span>
<sc-if value="{{m.more}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FCFCFC99" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{I.chevronRight}}"></path></svg></sc-if>
</button>
</sc-if>
</sc-for>
</div>

<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 32px 32px 24px 180px; display: flex; flex-wrap: wrap; gap: 32px; align-content: flex-start">

<div style="flex: 1 1 260px; max-width: 300px; display: flex; flex-direction: column; gap: 28px">

<section style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; color: #FCFCFC90">按側欄上方的「＋」</span>
<div style="display: flex; justify-content: flex-end; padding-right: 8px">
<span style="width: 36px; height: 36px; border-radius: 10px; background: #2F2F2F; display: flex; align-items: center; justify-content: center; color: #FCFCFC"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{I.plus}}"></path></svg></span>
</div>
<div role="menu" aria-label="新增" style="background: #262626; border-radius: 12px; padding: 6px; display: flex; flex-direction: column; box-shadow: 0 12px 32px rgba(0,0,0,.5)">
<sc-for list="{{plusMenu}}" as="m" hint-placeholder-count="8">
<sc-if value="{{m.sep}}" hint-placeholder-val="{{ false }}"><span style="height: 1px; background: #333333; margin: 4px 6px"></span></sc-if>
<sc-if value="{{m.item}}" hint-placeholder-val="{{ true }}">
<button type="button" role="menuitem" style="display: flex; align-items: center; gap: 12px; min-height: 34px; padding: 4px 10px; border: 0; border-radius: 8px; background: {{m.bg}}; color: {{m.c}}; font: inherit; font-size: 14px; text-align: left; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="{{m.icon}}"></path></svg>
<span style="flex: 1; display: flex; flex-direction: column; line-height: 1.35"><span>{{m.t}}</span><sc-if value="{{m.hasSub}}" hint-placeholder-val="{{ false }}"><span style="font-size: 12.5px; color: #FCFCFC90">{{m.sub}}</span></sc-if></span>
<span style="font-size: 12.5px; color: #FCFCFC90; font-family: {{m.rf}}">{{m.r}}</span>
</button>
</sc-if>
</sc-for>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; color: #FCFCFC90">分區標題上的「⋯」</span>
<div style="display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 6px 0 12px; border-radius: 8px; background: #191919; color: #FCFCFC90; font-size: 13px">
<span>營運部</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{I.chevronDown}}"></path></svg>
<span style="margin-left: auto; width: 26px; height: 26px; border-radius: 8px; background: #2F2F2F; color: #FCFCFC; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{I.ellipsis}}"></path></svg></span>
</div>
<div role="menu" aria-label="營運部" style="background: #262626; border-radius: 12px; padding: 6px; display: flex; flex-direction: column; box-shadow: 0 12px 32px rgba(0,0,0,.5)">
<sc-for list="{{secMenu}}" as="m" hint-placeholder-count="6">
<sc-if value="{{m.sep}}" hint-placeholder-val="{{ false }}"><span style="height: 1px; background: #333333; margin: 4px 6px"></span></sc-if>
<sc-if value="{{m.item}}" hint-placeholder-val="{{ true }}">
<button type="button" role="menuitem" style="display: flex; align-items: center; gap: 12px; min-height: 34px; padding: 4px 10px; border: 0; border-radius: 8px; background: transparent; color: {{m.c}}; font: inherit; font-size: 14px; text-align: left; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="{{m.icon}}"></path></svg>
<span style="flex: 1; display: flex; flex-direction: column; line-height: 1.35"><span>{{m.t}}</span><sc-if value="{{m.hasSub}}" hint-placeholder-val="{{ false }}"><span style="font-size: 12.5px; color: #FCFCFC90">{{m.sub}}</span></sc-if></span>
</button>
</sc-if>
</sc-for>
</div>
</section>
</div>

<section style="flex: 1 1 440px; max-width: 520px; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; color: #FCFCFC90">對話串上按右鍵 · 子選單從那一列旁邊展開</span>
<div style="position: relative; height: 470px">
<div style="width: 270px; background: #111111; border-radius: 14px; padding: 8px; box-sizing: border-box; display: flex; flex-direction: column; gap: 2px">
<div style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 8px; border-radius: 12px">
<dc-import name="Avatar" color="blue" body="cursor" state="working" dot="none" ring="#111111" size="30" hint-size="30px,30px"></dc-import>
<span style="flex: 1; font-size: 15px">小秘</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FCFCFC90" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{I.chevronDown}}"></path></svg>
</div>
<sc-for list="{{threads}}" as="t" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 8px; min-height: 34px; padding: 0 10px 0 48px; border-radius: 10px; background: {{t.bg}}; font-size: 14px; color: {{t.c}}">
<span style="flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.t}}</span><span style="font-size: 12px; color: #FCFCFC90">{{t.time}}</span>
</div>
</sc-for>
</div>

<div role="menu" aria-label="對話串「競品定價」" style="position: absolute; left: 120px; top: 92px; width: 220px; box-sizing: border-box; background: #262626; border-radius: 12px; padding: 6px; display: flex; flex-direction: column; box-shadow: 0 12px 32px rgba(0,0,0,.5)">
<sc-for list="{{threadMenu}}" as="m" hint-placeholder-count="8">
<sc-if value="{{m.sep}}" hint-placeholder-val="{{ false }}"><span style="height: 1px; background: #333333; margin: 4px 6px"></span></sc-if>
<sc-if value="{{m.item}}" hint-placeholder-val="{{ true }}">
<button type="button" role="menuitem" aria-haspopup="{{m.pop}}" style="display: flex; align-items: center; gap: 12px; min-height: 34px; padding: 0 10px; border: 0; border-radius: 8px; background: {{m.bg}}; color: {{m.c}}; font: inherit; font-size: 14px; text-align: left; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="{{m.icon}}"></path></svg>
<span style="flex: 1">{{m.t}}</span>
<sc-if value="{{m.more}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FCFCFC99" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{I.chevronRight}}"></path></svg></sc-if>
</button>
</sc-if>
</sc-for>
</div>

<div role="menu" aria-label="延後提醒" style="position: absolute; left: 344px; top: 160px; width: 196px; box-sizing: border-box; background: #262626; border-radius: 12px; padding: 6px; display: flex; flex-direction: column; box-shadow: 0 12px 32px rgba(0,0,0,.5)">
<sc-for list="{{snooze}}" as="m" hint-placeholder-count="5">
<sc-if value="{{m.sep}}" hint-placeholder-val="{{ false }}"><span style="height: 1px; background: #333333; margin: 4px 6px"></span></sc-if>
<sc-if value="{{m.item}}" hint-placeholder-val="{{ true }}">
<button type="button" role="menuitem" style="display: flex; align-items: center; gap: 10px; min-height: 34px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; color: #FCFCFC; font: inherit; font-size: 14px; text-align: left; cursor: pointer">
<span style="flex: 1">{{m.t}}</span><span style="font-size: 12.5px; color: #FCFCFC90">{{m.r}}</span>
</button>
</sc-if>
</sc-for>
</div>
</div>
</section>

</main>
</div>
</x-dc>
