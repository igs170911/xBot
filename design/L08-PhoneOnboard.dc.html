<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<title>手機：首次設定</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;font-synthesis:none;background:#070707}
a{color:#7FC0FF;text-decoration:none}a:hover{color:#A8D4FF}
button{font:inherit}
textarea::placeholder,input::placeholder{color:#FCFCFC90}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #070707; color: #FCFCFC; font-family: 'Huninn', 'PingFang TC', 'Noto Sans TC', sans-serif; font-size: 15px; line-height: 1.45; display: flex; flex-direction: column">
<div aria-hidden="true" style="height: 47px; flex: none"></div>
<header style="flex: none; height: 56px; padding: 0 16px; display: flex; align-items: center; gap: 10px">
<dc-import name="Mochi" size="26" pose="wave" hint-size="26px,26px"></dc-import>
<span style="flex: 1; display: flex; align-items: center; gap: 6px" role="img" aria-label="第 {{stepNo}} 步，共 2 步">
<span style="width: 22px; height: 4px; border-radius: 9px; background: #FCFCFC"></span>
<span style="width: 22px; height: 4px; border-radius: 9px; background: {{bar2}}"></span>
<span style="font-size: 13px; color: #FCFCFC99; margin-left: 4px">{{stepNo}}/2</span>
</span>
<span style="height: 24px; display: inline-flex; align-items: center; gap: 4px; padding: 0 9px; border-radius: 999px; background: rgba(16,132,254,.2); color: #7FC0FF; font-size: 12px; white-space: nowrap; flex: none"><span style="display: flex"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; display: block"><path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z"></path><path d="M20 2v4"></path><path d="M22 4h-4"></path><path d="M2 20a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"></path></svg></span>簡化：6 步 → 2 步</span>
</header>

<sc-if value="{{s1}}" hint-placeholder-val="{{ true }}">
<div style="flex: 1; min-height: 0; padding: 4px 16px 0; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h2 style="margin: 0; font-size: 24px; font-weight: 400; line-height: 1.3">先接上 AI</h2>
<p style="margin: 0; font-size: 14.5px; color: #FCFCFC99">這台電腦上已經登入的 AI，選一個就能開始。</p>
</div>
<div role="status" style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #FCFCFC99"><span style="color: #38D591; display: flex"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; display: block"><path d="M2 12a10 10 0 1 0 20 0a10 10 0 1 0 -20 0"></path><path d="m16 9-5.5 5.5L8 12"></path></svg></span>找到 3 個可以用的</div>
<div style="background: #262626; border-radius: 18px; overflow: hidden">
<sc-for list="{{engines}}" as="e" hint-placeholder-count="3">
<div style="min-height: 68px; display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 14px; box-sizing: border-box; border-top: {{e.line}}">
<span aria-hidden="true" style="width: 40px; height: 40px; flex: none; border-radius: 12px; background: #2F2F2F; color: #FCFCFC; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; display: block"><path d="M12 19h8"></path><path d="m4 17 6-6-6-6"></path></svg></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
<span style="font-size: 15.5px">{{e.name}}</span>
<span style="font-size: 13px; color: #FCFCFC99; display: flex; align-items: center; gap: 6px"><span style="width: 7px; height: 7px; border-radius: 9px; background: #38D591; flex: none"></span>{{e.sub}}</span>
</span>
<button type="button" onClick="{{e.use}}" style="height: 44px; padding: 0 16px; flex: none; border: {{e.border}}; border-radius: 999px; background: {{e.bg}}; color: {{e.ink}}; font-size: 14.5px; cursor: pointer">用這個</button>
</div>
</sc-for>
</div>
<button type="button" aria-expanded="{{keyOpen}}" onClick="{{toggleKey}}" style="height: 48px; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 14px; border: 1px solid #333333; border-radius: 14px; background: transparent; color: #FCFCFC; font-size: 15px; text-align: left; cursor: pointer">
<span style="color: #FCFCFC99; display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; display: block"><path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"></path><path d="M16 7.5a0.5 0.5 0 1 0 1 0a0.5 0.5 0 1 0 -1 0"></path></svg></span><span style="flex: 1">沒有要用的？貼上 API 金鑰</span><span style="color: #FCFCFC90; display: flex; transform: rotate({{keyRot}})"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; display: block"><path d="m9 18 6-6-6-6"></path></svg></span></button>
<sc-if value="{{keyOpen}}" hint-placeholder-val="{{ false }}">
<label style="display: flex; flex-direction: column; gap: 6px; margin-top: -6px">
<span style="font-size: 13px; color: #FCFCFC99">貼上金鑰，會自動認出是哪一家</span>
<input type="text" placeholder="sk-…" style="height: 44px; box-sizing: border-box; padding: 0 14px; border: 1px solid #333333; border-radius: 10px; background: #191919; color: #FCFCFC; font: inherit; font-size: 15px; outline: none">
</label>
</sc-if>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding-bottom: 12px">
<span style="font-size: 12.5px; color: #FCFCFC90; padding-left: 4px">下一步</span>
<div aria-hidden="true" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px dashed #333333; border-radius: 14px; opacity: .72">
<dc-import name="Avatar" color="blue" state="idle" dot="none" ring="#070707" size="36" hint-size="36px,36px"></dc-import>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 14.5px">2/2 認識小秘</span><span style="font-size: 12.5px; color: #FCFCFC99">名字、顏色、權限都幫你設好了</span></span>
<span style="height: 30px; padding: 0 12px; border-radius: 999px; background: #2F2F2F; font-size: 13px; line-height: 30px">開始</span>
</div>
</div>
</div>
</sc-if>

<sc-if value="{{s2}}" hint-placeholder-val="{{ false }}">
<div style="flex: 1; min-height: 0; padding: 4px 16px 12px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding-top: 4px">
<dc-import name="Avatar" color="blue" state="happy" dot="none" ring="#070707" size="96" hint-size="96px,96px"></dc-import>
<h2 style="margin: 4px 0 0; font-size: 24px; font-weight: 400; line-height: 1.3">嗨，我是小秘</h2>
<p style="margin: 0; font-size: 14.5px; color: #FCFCFC99; text-align: center">你的幕僚長。交代我事情，<br>我會分給其他 Bot 去做。</p>
</div>
<dl style="margin: 0; background: #262626; border-radius: 18px; padding: 0 14px">
<div style="height: 48px; display: flex; align-items: center; gap: 12px"><dt style="width: 64px; font-size: 14px; color: #FCFCFC99">名字</dt><dd style="margin: 0; flex: 1; font-size: 15px">小秘</dd></div>
<div style="height: 48px; display: flex; align-items: center; gap: 12px; border-top: 1px solid #333333"><dt style="width: 64px; font-size: 14px; color: #FCFCFC99">用的 AI</dt><dd style="margin: 0; flex: 1; font-size: 15px">{{engineName}}</dd></div>
<div style="height: 48px; display: flex; align-items: center; gap: 12px; border-top: 1px solid #333333"><dt style="width: 64px; font-size: 14px; color: #FCFCFC99">權限</dt><dd style="margin: 0; flex: 1; font-size: 15px">先問我<span style="font-size: 13px; color: #FCFCFC99"> · 花錢、上架前會問你</span></dd></div>
</dl>
<div role="status" style="display: flex; flex-direction: column; gap: 6px; padding: 0 2px">
<div style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #FCFCFC99"><span style="flex: 1">小秘的電腦在背景準備中…</span><span>約 1 分鐘</span></div>
<span role="img" aria-label="準備進度 40%" style="height: 4px; border-radius: 9px; background: #333333; display: block; overflow: hidden"><span style="display: block; width: 40%; height: 4px; background: #1084FE"></span></span>
</div>
<p style="margin: 0; font-size: 13px; color: #FCFCFC90; padding: 0 2px">帶入舊設定、連手機、導覽，之後在首頁的「之後再做」裡。</p>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px">
<a href="L02-PhoneInbox.dc.html" style="height: 48px; border-radius: 999px; background: #FCFCFC; color: #070707; font-size: 15.5px; display: flex; align-items: center; justify-content: center">開始</a>
<button type="button" onClick="{{back}}" style="height: 44px; border: 0; border-radius: 999px; background: transparent; color: #FCFCFC99; font-size: 14.5px; cursor: pointer">換一個 AI</button>
</div>
</div>
</sc-if>
<div aria-hidden="true" style="height: 34px; flex: none"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const st = this.state || {};
const step = st.step || 1;
const pick = st.pick || 'cc';
const keyOpen = !!st.key;
const list = [
{ id: 'cc', name: 'Claude Code', sub: '已登入 · 訂閱方案' },
{ id: 'cx', name: 'Codex', sub: '已登入 · ChatGPT 帳號' },
{ id: 'ol', name: '本機模型', sub: 'Ollama · 2 個模型' }
];
const engines = list.map((e, i) => Object.assign({}, e, {
line: i ? '1px solid #333333' : '0',
bg: i === 0 ? '#FCFCFC' : '#2F2F2F',
ink: i === 0 ? '#070707' : '#FCFCFC',
border: '0',
use: () => this.setState({ step: 2, pick: e.id })
}));
const names = { cc: 'Claude Code', cx: 'Codex', ol: '本機模型' };
return {
s1: step === 1, s2: step === 2, stepNo: step,
bar2: step === 2 ? '#FCFCFC' : '#333333',
engines, engineName: names[pick],
keyOpen, keyRot: keyOpen ? '90deg' : '0deg',
toggleKey: () => this.setState({ key: !keyOpen }),
back: () => this.setState({ step: 1 })
};
}
}
</script>
</body>
</html>
