<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<title>手機：新增 Bot</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;font-synthesis:none;background:#070707}
a{color:#7FC0FF;text-decoration:none}a:hover{color:#A8D4FF}
button{font:inherit}
textarea::placeholder,input::placeholder{color:#FCFCFC90}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #070707; color: #FCFCFC; font-family: 'Huninn', 'PingFang TC', 'Noto Sans TC', sans-serif; font-size: 15px; line-height: 1.45; display: flex; flex-direction: column">
<div aria-hidden="true" style="height: 47px; flex: none"></div>
<header style="flex: none; height: 56px; padding: 0 12px; display: flex; align-items: center; gap: 10px">
<a href="L01-PhoneList.dc.html" aria-label="返回" style="width: 44px; height: 44px; flex: none; box-sizing: border-box; border-radius: 999px; background: #191919; border: 1px solid #333333; color: #FCFCFC; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; display: block"><path d="m15 18-6-6 6-6"></path></svg></a>
<h1 style="margin: 0; flex: 1; min-width: 0; font-size: 17px; font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">新增 Bot</h1>

</header>
<div style="flex: none; display: flex; justify-content: flex-end; padding: 0 16px 10px; margin-top: -4px"><span style="height: 24px; display: inline-flex; align-items: center; gap: 4px; padding: 0 9px; border-radius: 999px; background: rgba(16,132,254,.2); color: #7FC0FF; font-size: 12px; white-space: nowrap; flex: none"><span style="display: flex"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; display: block"><path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z"></path><path d="M20 2v4"></path><path d="M22 4h-4"></path><path d="M2 20a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"></path></svg></span>簡化：2 個畫面 10 個欄位 → 1 個欄位</span></div>
<div style="flex: 1; min-height: 0; overflow-y: auto; padding: 0 16px 12px; display: flex; flex-direction: column; gap: 14px">
<sc-if value="{{notDone}}" hint-placeholder-val="{{ true }}">
<label style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 20px; line-height: 1.35">一句話說你要它做什麼</span>
<textarea rows="3" placeholder="例：每天整理新聞給我" style="min-height: 92px; box-sizing: border-box; padding: 12px 14px; border: 1px solid {{inputLine}}; border-radius: 14px; background: #191919; color: #FCFCFC; font: inherit; font-size: 15px; line-height: 1.55; resize: none; outline: none">每天幫我回覆蝦皮買家的問題，不確定的先問我</textarea>
</label>
<sc-if value="{{isTyping}}" hint-placeholder-val="{{ false }}">
<button type="button" onClick="{{suggest}}" style="height: 48px; border: 0; border-radius: 999px; background: #FCFCFC; color: #070707; font-size: 15.5px; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; display: block"><path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z"></path><path d="M20 2v4"></path><path d="M22 4h-4"></path><path d="M2 20a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"></path></svg>幫我想好其他的</button>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; color: #FCFCFC90">別人常這樣寫</span>
<button type="button" style="min-height: 44px; padding: 0 14px; border: 1px solid #333333; border-radius: 12px; background: transparent; color: #FCFCFC99; font-size: 14px; text-align: left; cursor: pointer">每週一整理上週的業績給我</button>
<button type="button" style="min-height: 44px; padding: 0 14px; border: 1px solid #333333; border-radius: 12px; background: transparent; color: #FCFCFC99; font-size: 14px; text-align: left; cursor: pointer">幫我看 Gmail，重要的信才通知我</button>
</div>
</sc-if>
</sc-if>

<sc-if value="{{showCard}}" hint-placeholder-val="{{ true }}">
<section aria-labelledby="sug" style="background: #262626; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 12px">
<dc-import name="Avatar" color="teal" body="drop" state="happy" dot="none" ring="#262626" size="52" hint-size="52px,52px"></dc-import>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<span id="sug" style="font-size: 17px">客服小蝦</span>
<span style="font-size: 13.5px; color: #FCFCFC99">蝦皮客服 · 回覆買家問題</span>
</div>
<span style="align-self: flex-start; height: 24px; display: inline-flex; align-items: center; gap: 4px; padding: 0 9px; border-radius: 999px; background: #2F2F2F; color: #FCFCFC99; font-size: 12px; white-space: nowrap"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; display: block"><path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z"></path><path d="M20 2v4"></path><path d="M22 4h-4"></path><path d="M2 20a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"></path></svg>系統建議</span>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; color: #FCFCFC99">技能</span>
<div style="display: flex; flex-wrap: wrap; gap: 6px"><span style="height: 30px; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; border: 1px solid #333333; border-radius: 999px; font-size: 13.5px; white-space: nowrap">回覆買家</span><span style="height: 30px; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; border: 1px solid #333333; border-radius: 999px; font-size: 13.5px; white-space: nowrap">查訂單狀態</span><span style="height: 30px; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; border: 1px solid #333333; border-radius: 999px; font-size: 13.5px; white-space: nowrap">整理常見問題</span></div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; color: #FCFCFC99">要連的應用程式</span>
<div style="display: flex; flex-wrap: wrap; gap: 6px"><span style="height: 30px; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; border: 1px solid #333333; border-radius: 999px; font-size: 13.5px; white-space: nowrap"><span style="color: #FCFCFC99; display: flex"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; display: block"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg></span>蝦皮賣家中心</span><span style="height: 30px; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; border: 1px solid #333333; border-radius: 999px; font-size: 13.5px; white-space: nowrap"><span style="color: #FCFCFC99; display: flex"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; display: block"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg></span>Gmail</span></div>
</div>
<div style="display: flex; align-items: center; gap: 8px; padding-top: 12px; border-top: 1px solid #333333; font-size: 13.5px; color: #FCFCFC99">
<span style="display: flex"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; display: block"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"></path><path d="m9 12 2 2 4-4"></path></svg></span><span style="flex: 1">權限：先問我 · 退款、對客承諾前問你</span>
</div>
<p style="margin: -4px 0 0; font-size: 12.5px; color: #FCFCFC90">名字、人設、技能都可以之後在 Bot 資料裡改。</p>
</section>
</sc-if>

<sc-if value="{{isDone}}" hint-placeholder-val="{{ false }}">
<div role="status" style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 28px 0 8px; text-align: center">
<dc-import name="Avatar" color="teal" body="drop" state="happy" dot="none" ring="#070707" size="80" hint-size="80px,80px"></dc-import>
<span style="font-size: 20px; margin-top: 6px">客服小蝦 已加入</span>
<span style="font-size: 14px; color: #FCFCFC99">電腦在背景準備中，第一個工作進來就會開機。</span>
</div>
</sc-if>
</div>
<div style="flex: none; padding: 8px 16px 0; display: flex; flex-direction: column; gap: 6px">
<sc-if value="{{showCard}}" hint-placeholder-val="{{ true }}">
<button type="button" onClick="{{create}}" style="height: 48px; border: 0; border-radius: 999px; background: #FCFCFC; color: #070707; font-size: 15.5px; cursor: pointer">建立</button>
<div style="display: flex; align-items: center; justify-content: space-between">
<button type="button" onClick="{{retry}}" style="height: 44px; padding: 0 8px; border: 0; background: transparent; color: #FCFCFC99; font-size: 14px; display: flex; align-items: center; gap: 6px; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; display: block"><path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z"></path><path d="M20 2v4"></path><path d="M22 4h-4"></path><path d="M2 20a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"></path></svg>重新建議</button>
<span style="font-size: 12.5px; color: #FCFCFC90">今天還能建立 2 個</span>
</div>
</sc-if>
<sc-if value="{{isDone}}" hint-placeholder-val="{{ false }}">
<a href="L03-PhoneChat.dc.html" style="height: 48px; border-radius: 999px; background: #FCFCFC; color: #070707; font-size: 15.5px; display: flex; align-items: center; justify-content: center">跟小蝦說話</a>
<button type="button" onClick="{{retry}}" style="height: 44px; border: 0; background: transparent; color: #FCFCFC99; font-size: 14px; cursor: pointer">再建一個</button>
</sc-if>
</div>
<div aria-hidden="true" style="height: 34px; flex: none"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const v = (this.state && this.state.v) || 'card';
return {
isTyping: v === 'typing', showCard: v === 'card', isDone: v === 'done', notDone: v !== 'done',
inputLine: v === 'typing' ? '#459FFE' : '#333333',
suggest: () => this.setState({ v: 'card' }),
create: () => this.setState({ v: 'done' }),
retry: () => this.setState({ v: 'typing' })
};
}
}
</script>
</body>
</html>
