<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<title>手機：群組對話</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;font-synthesis:none;background:#070707}
a{color:#7FC0FF;text-decoration:none}a:hover{color:#A8D4FF}
button{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #070707; color: #FCFCFC; font-family: 'Huninn', 'PingFang TC', 'Noto Sans TC', sans-serif; font-size: 15px; line-height: 1.5; display: flex; flex-direction: column">
<div aria-hidden="true" style="height: 47px; flex: none"></div>

<header style="flex: none; padding: 4px 16px 0; display: flex; flex-direction: column; align-items: center; gap: 6px">
<div style="width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 8px">
<div style="display: flex; align-items: center; gap: 8px">
<a href="L01-PhoneList.dc.html" aria-label="返回對話清單" style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 999px; background: #191919; border: 1px solid #333333; color: #FCFCFC; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; display: block"><path d="m15 18-6-6 6-6"></path></svg></a>
<a href="D05-GroupCall.dc.html" aria-label="群組通話" style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 999px; background: #191919; border: 1px solid #333333; color: #FCFCFC; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; display: block"><path d="M13.832 16.568a1 1 0 0 0 1.213-.303l.355-.465A2 2 0 0 1 17 15h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2A18 18 0 0 1 2 4a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v3a2 2 0 0 1-.8 1.6l-.468.351a1 1 0 0 0-.292 1.233 14 14 0 0 0 6.392 6.384"></path></svg></a>
</div>
<span role="img" aria-label="新品上架專案：小秘、阿哲、小編" style="width: 44px; height: 44px; position: relative; display: block">
<span style="position: absolute; left: 0; top: 2px"><dc-import name="Avatar" color="blue" body="cursor" state="idle" dot="none" ring="#070707" size="28" hint-size="28px,28px"></dc-import></span>
<span style="position: absolute; left: 16px; top: 2px"><dc-import name="Avatar" color="orange" body="blob" state="working" dot="none" ring="#070707" size="28" hint-size="28px,28px"></dc-import></span>
<span style="position: absolute; left: 20px; top: 24px; height: 20px; min-width: 24px; padding: 0 5px; box-sizing: border-box; border-radius: 999px; background: #2F2F2F; border: 2px solid #070707; font-size: 11px; line-height: 16px; text-align: center">+1</span>
</span>
<div style="display: flex; align-items: center; justify-content: flex-end; gap: 8px">
<button type="button" aria-label="成員（3 位 Bot）" style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 999px; background: #191919; border: 1px solid #333333; color: #FCFCFC; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; display: block"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><path d="M16 3.128a4 4 0 0 1 0 7.744"></path><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M5 7a4 4 0 1 0 8 0a4 4 0 1 0 -8 0"></path></svg></button>
<button type="button" aria-label="更多動作" style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 999px; background: #191919; border: 1px solid #333333; color: #FCFCFC; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; display: block"><path d="M11 12a1 1 0 1 0 2 0a1 1 0 1 0 -2 0"></path><path d="M18 12a1 1 0 1 0 2 0a1 1 0 1 0 -2 0"></path><path d="M4 12a1 1 0 1 0 2 0a1 1 0 1 0 -2 0"></path></svg></button>
</div>
</div>
<button type="button" aria-label="新品上架專案，群組設定" style="height: 44px; padding: 0 14px 0 16px; box-sizing: border-box; border-radius: 999px; background: #191919; border: 1px solid #333333; color: #FCFCFC; display: flex; align-items: center; gap: 6px; cursor: pointer">
<span style="font-size: 15.5px">新品上架專案</span><span style="font-size: 13.5px; color: #FCFCFC99">小秘、阿哲、小編</span><span style="color: #FCFCFC99; display: flex"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; display: block"><path d="m6 9 6 6 6-6"></path></svg></span></button>
</header>

<main style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; gap: 10px; padding: 8px 16px 10px">
<p style="margin: 0; text-align: center; font-size: 12.5px; color: #FCFCFC90">今天 下午 2:40</p>
<div style="align-self: flex-end; max-width: 80%; background: #5A5A5A; border-radius: 20px; padding: 10px 16px; font-size: 15px"><span style="white-space: nowrap; color: #CFE6FF">@阿哲</span> 先抓三家帆布包的價格，<span style="white-space: nowrap; color: #CFE6FF">@小編</span> 等價格出來再寫上架文案。</div>

<div style="align-self: flex-start; max-width: 80%; display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; align-items: center; gap: 6px; padding-left: 4px; font-size: 13px; color: #FCFCFC99"><dc-import name="Avatar" color="blue" body="cursor" state="idle" dot="none" ring="#070707" size="20" hint-size="20px,20px"></dc-import>小秘</div>
<div style="background: #262626; border-radius: 20px; padding: 10px 16px; font-size: 15px">好，我來盯進度。價格出來我會整理成提案給你。</div>
</div>

<div style="align-self: flex-start; max-width: 80%; display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; align-items: center; gap: 6px; padding-left: 4px; font-size: 13px; color: #FCFCFC99"><dc-import name="Avatar" color="orange" body="blob" state="happy" dot="none" ring="#070707" size="20" hint-size="20px,20px"></dc-import>阿哲</div>
<div style="background: #262626; border-radius: 20px; padding: 10px 16px 12px; font-size: 15px; display: flex; flex-direction: column; gap: 10px">
<span>三家分別是 NT$990、NT$1,080、NT$1,150。建議定 NT$1,020，比價表在這裡。</span>
<a href="E07-Files.dc.html" style="display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 6px 10px 6px 6px; border-radius: 12px; background: #191919; color: #FCFCFC">
<span aria-hidden="true" style="width: 40px; height: 40px; flex: none; border-radius: 8px; background: #FFFFFF; overflow: hidden; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; padding: 5px; box-sizing: border-box; background-clip: padding-box"><span style="background: #38D591"></span><span style="background: #38D591"></span><span style="background: #38D591"></span><span style="background: #E5E7EB"></span><span style="background: #E5E7EB"></span><span style="background: #E5E7EB"></span><span style="background: #E5E7EB"></span><span style="background: #E5E7EB"></span><span style="background: #E5E7EB"></span><span style="background: #E5E7EB"></span><span style="background: #E5E7EB"></span><span style="background: #E5E7EB"></span></span>
<span style="flex: 1; min-width: 0"><span style="display: block; font-size: 14px">三家比價.xlsx</span><span style="display: block; font-size: 12.5px; color: #FCFCFC99">試算表 · 12 KB</span></span>
<span style="color: #FCFCFC90; display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; display: block"><path d="m9 18 6-6-6-6"></path></svg></span>
</a>
</div>
</div>

<span style="align-self: center; height: 30px; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; border: 1px solid #333333; border-radius: 999px; font-size: 13px; color: #FCFCFC99"><span style="color: #7FC0FF; display: flex"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; display: block"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg></span>第 2/4 輪 · 小編正在寫文案…</span>
</main>

<div role="group" aria-label="指定 Bot" style="flex: none; display: flex; justify-content: space-between; gap: 4px; padding: 0 12px 8px; overflow-x: auto">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="4">
<button type="button" aria-pressed="{{c.on}}" onClick="{{c.pick}}" style="height: 44px; flex: none; padding: 0 10px 0 7px; box-sizing: border-box; border-radius: 999px; background: {{c.bg}}; border: 1px solid {{c.line}}; color: #FCFCFC; display: flex; align-items: center; gap: 5px; font-size: 14px; white-space: nowrap; cursor: pointer">
<sc-if value="{{c.bot}}" hint-placeholder-val="{{ true }}"><dc-import name="Avatar" color="{{c.color}}" body="{{c.body}}" state="idle" dot="none" ring="{{c.bg}}" size="20" hint-size="20px,20px"></dc-import></sc-if>
<sc-if value="{{c.all}}" hint-placeholder-val="{{ false }}"><span style="color: #FCFCFC99; display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; display: block"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><path d="M16 3.128a4 4 0 0 1 0 7.744"></path><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M5 7a4 4 0 1 0 8 0a4 4 0 1 0 -8 0"></path></svg></span></sc-if>
<span>@{{c.name}}</span></button>
</sc-for>
</div>

<div style="flex: none; height: 52px; margin-bottom: 34px; padding: 0 12px; display: flex; align-items: center; gap: 8px">
<button type="button" aria-label="附加檔案或工具" style="width: 52px; height: 52px; flex: none; border-radius: 999px; background: #191919; border: 1px solid #333333; color: #FCFCFC; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; display: block"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></button>
<label style="flex: 1; min-width: 0; height: 52px; border-radius: 999px; background: #2F2F2F; display: flex; align-items: center; padding: 0 4px 0 18px; box-sizing: border-box">
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">訊息</span>
<input type="text" placeholder="{{placeholder}}" style="flex: 1; min-width: 0; height: 44px; border: 0; background: transparent; color: #FCFCFC; font: inherit; font-size: 15px; outline: none; padding: 0">
<button type="button" aria-label="語音輸入" style="width: 44px; height: 44px; border: 0; background: transparent; color: #FCFCFC; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; display: block"><path d="M12 19v3"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><path d="M12 2h0a3 3 0 0 1 3 3v7a3 3 0 0 1 -3 3h0a3 3 0 0 1 -3 -3v-7a3 3 0 0 1 3 -3Z"></path></svg></button>
<button type="button" aria-label="送出" style="width: 44px; height: 44px; border: 0; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer"><span style="width: 34px; height: 34px; border-radius: 999px; background: #FCFCFC; color: #070707; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; display: block"><path d="m5 12 7-7 7 7"></path><path d="M12 19V5"></path></svg></span></button>
</label>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const sel = (this.state && this.state.sel) || '';
const chips = [
{ name: '小秘', color: 'blue', body: 'cursor', bot: true, all: false },
{ name: '阿哲', color: 'orange', body: 'blob', bot: true, all: false },
{ name: '小編', color: 'pink', body: 'circle', bot: true, all: false },
{ name: '所有人', color: 'blue', body: 'cursor', bot: false, all: true }
].map((c) => {
const on = sel === c.name;
return Object.assign({}, c, { on, bg: on ? '#2F2F2F' : '#191919', line: on ? '#5A5A5A' : '#333333', pick: () => this.setState({ sel: on ? '' : c.name }) });
});
return { chips, placeholder: sel ? '傳給 @' + sel + '…' : '傳到群組…' };
}
}
</script>
</body>
</html>
