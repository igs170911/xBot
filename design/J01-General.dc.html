ref="J09-SkillsLab.dc.html" style="display: flex; align-items: center; height: 32px; padding: 0 10px 0 38px; border-radius: 10px; background: transparent; color: #FCFCFC99; text-decoration: none; font-size: 13.5px">技能庫與實驗</a><span style="margin-top: auto; padding: 0 10px; font-size: 12px; color: #FCFCFC90">XBot 0.3.2 · 變更會自動儲存</span></nav>
<main data-fit="content" style="flex: 1; min-width: 0; overflow-y: auto; box-sizing: border-box; padding: 22px 28px 24px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; align-items: flex-start; gap: 16px"><div style="flex: 1; min-width: 0"><h2 style="margin: 0; font-size: 18px; font-weight: 400; color: #FCFCFC">一般</h2><p style="margin: 2px 0 0; font-size: 13.5px; color: #FCFCFC99; line-height: 1.5">外觀、語言與通知。改了馬上生效，不用按儲存。</p></div></div>
<section style="display: flex; flex-direction: column; gap: 10px"><div style="display: flex; align-items: center; gap: 12px; min-height: 22px"><span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><h3 style="margin: 0; font-size: 15px; font-weight: 400; color: #FCFCFC">外觀</h3></span></div><div style="background: #262626; border-radius: 14px; display: flex; flex-direction: column; overflow: hidden"><div style="padding: 14px 16px 16px; border-top: 0"><div style="display: flex; flex-direction: column; gap: 12px"><span><span style="display: block; font-size: 14.5px; color: #FCFCFC; line-height: 1.45">主題</span><span style="display: block; font-size: 13px; color: #FCFCFC99; line-height: 1.5; margin-top: 2px">預設 Midnight 深色；介面黑白為底，顏色留給 Bot。</span></span><div role="group" aria-label="主題" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{themes}}" as="t" hint-placeholder-count="3">
<button type="button" aria-pressed="{{t.sel}}" onClick="{{t.pick}}" style="display: flex; flex-direction: column; gap: 8px; padding: 6px 6px 10px; border-radius: 14px; border: 2px solid {{t.ring}}; background: #191919; color: #FCFCFC; font: inherit; text-align: left; cursor: pointer">
<span style="display: flex; height: 76px; border-radius: 10px; overflow: hidden; border: 1px solid #333333">
<sc-for list="{{t.halves}}" as="h" hint-placeholder-count="1">
<span style="flex: 1; display: flex; background: {{h.bg}}">
<span style="width: 28%; background: {{h.side}}; display: flex; flex-direction: column; gap: 5px; padding: 8px 6px; box-sizing: border-box">
<span style="height: 6px; border-radius: 3px; background: {{h.line}}"></span>
<span style="height: 6px; width: 70%; border-radius: 3px; background: {{h.line}}"></span>
<span style="height: 6px; width: 85%; border-radius: 3px; background: {{h.line}}"></span>
</span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 5px; padding: 8px; box-sizing: border-box">
<span style="align-self: flex-end; width: 46%; height: 12px; border-radius: 6px; background: {{h.you}}"></span>
<span style="width: 70%; height: 20px; border-radius: 8px; background: {{h.bot}}"></span>
<span style="margin-top: auto; height: 12px; border-radius: 999px; background: {{h.comp}}"></span>
</span>
</span>
</sc-for>
</span>
<span style="display: flex; align-items: center; gap: 8px; padding: 0 4px">
<span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 14px">{{t.name}}</span><span style="font-size: 12.5px; color: #FCFCFC99">{{t.sub}}</span></span>
<sc-if value="{{t.on}}" hint-placeholder-val="{{ false }}"><span style="width: 20px; height: 20px; border-radius: 999px; background: #1084FE; display: flex; align-items: center; justify-content: center"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M20 6 9 17l-5-5"></path></svg></span></sc-if>
</span>
</button>
</sc-for>
</div></div></div><div style="display: flex; align-items: center; gap: 16px; padding: 12px 16px; border-top: 1px solid #333333">
<span style="flex: 1; min-width: 0"><span style="display: block; font-size: 14.5px; color: #FCFCFC; line-height: 1.45">字型</span><span style="display: block; font-size: 13px; color: #FCFCFC99; line-height: 1.5; margin-top: 2px">全部畫面都用粉圓</span></span>
<span style="font-size: 14px; color: #FCFCFCcc; white-space: nowrap">粉圓</span>
</div></div></section>
<section style="display: flex; flex-direction: column; gap: 10px"><div style="display: flex; align-items: center; gap: 12px; min-height: 22px"><span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><h3 style="margin: 0; font-size: 15px; font-weight: 400; color: #FCFCFC">語言</h3></span></div><div style="background: #262626; border-radius: 14px; display: flex; flex-direction: column; overflow: hidden"><div style="display: flex; align-items: center; gap: 16px; padding: 12px 16px; border-top: 0"><span style="flex: 1; min-width: 0"><span style="display: block; font-size: 14.5px; color: #FCFCFC; line-height: 1.45">介面語言</span><span style="display: block; font-size: 13px; color: #FCFCFC99; line-height: 1.5; margin-top: 2px">用注音、倉頡選字時按 Enter 不會送出訊息</span></span><button type="button" aria-haspopup="listbox" aria-label="介面語言" style="width: 220px; height: 40px; flex: none; box-sizing: border-box; padding: 0 10px 0 12px; border: 1px solid #333333; border-radius: 10px; background: #191919; color: #FCFCFC; font: inherit; font-size: 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; white-space: nowrap; cursor: pointer"><span style="overflow: hidden; text-overflow: ellipsis">繁體中文（台灣）</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FCFCFC99" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="m6 9 6 6 6-6"></path></svg></button></div></div></section>
<section style="display: flex; flex-direction: column; gap: 10px"><div style="display: flex; align-items: center; gap: 12px; min-height: 22px"><span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><h3 style="margin: 0; font-size: 15px; font-weight: 400; color: #FCFCFC">通知</h3></span></div><div style="background: #262626; border-radius: 14px; display: flex; flex-direction: column; overflow: hidden"><div style="display: flex; align-items: center; gap: 16px; padding: 12px 16px; border-top: 0"><span style="flex: 1; min-width: 0"><span style="display: block; font-size: 14.5px; color: #FCFCFC; line-height: 1.45">Bot 做完或等你時通知我</span><span style="display: block; font-size: 13px; color: #FCFCFC99; line-height: 1.5; margin-top: 2px">XBot 在背景時跳系統通知；手機網頁版目前沒有推播</span></span><button type="button" role="switch" aria-checked="true" aria-label="Bot 做完或等你時通知我" style="width: 40px; height: 24px; flex: none; border: 0; border-radius: 999px; background: #1084FE; padding: 2px; display: flex; justify-content: flex-end; cursor: pointer"><span style="width: 20px; height: 20px; border-radius: 999px; background: #FFFFFF"></span></button></div><div style="display: flex; align-items: center; gap: 16px; padding: 12px 16px; border-top: 1px solid #333333"><span style="flex: 1; min-width: 0"><span style="display: block; font-size: 14.5px; color: #FCFCFC; line-height: 1.45">通知音效</span><span style="display: block; font-size: 13px; color: #FCFCFC99; line-height: 1.5; margin-top: 2px">只有等你的事（核定、提問、接手電腦）才發出聲音</span></span><button type="button" role="switch" aria-checked="true" aria-label="通知音效" style="width: 40px; height: 24px; flex: none; border: 0; border-radius: 999px; background: #1084FE; padding: 2px; display: flex; justify-content: flex-end; cursor: pointer"><span style="width: 20px; height: 20px; border-radius: 999px; background: #FFFFFF"></span></button></div></div></section>
</main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 1100, "height": 900}}'>
class Component extends DCLogic {
renderVals() {
const theme = (this.state && this.state.theme) || 'midnight';
const D = { bg: '#070707', side: '#111111', line: '#333333', you: '#5A5A5A', bot: '#262626', comp: '#2F2F2F' };
const L = { bg: '#FFFFFF', side: '#F3F3F4', line: '#D9D9DC', you: '#D4D4D8', bot: '#EDEDEF', comp: '#E6E6E9' };
const defs = [
  { k: 'midnight', name: 'Midnight', sub: '深色 · 預設', halves: [D] },
  { k: 'daylight', name: 'Daylight', sub: '淺色', halves: [L] },
  { k: 'system', name: '跟隨系統', sub: '白天淺色、晚上深色', halves: [D, L] }
];
const themes = defs.map((t) => Object.assign({}, t, {
  on: theme === t.k, sel: theme === t.k ? 'true' : 'false',
  ring: theme === t.k ? '#1084FE' : '#262626',
  pick: () => this.setState({ theme: t.k })
}));
return { themes };
}
}
</script>
