<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<title>XBot Bot 頭像（Grok 平面風）</title>

<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<span style="position: relative; display: block; width: {{s}}px; height: {{s}}px; flex: none">
<svg viewBox="0 0 44 44" width="{{s}}" height="{{s}}" aria-hidden="true" style="display: block; overflow: visible">
<sc-if value="{{noImg}}" hint-placeholder-val="{{ true }}">
<path d="{{body}}" fill="{{fill}}"></path>
<g transform="{{eyeAt}}"><g>
<sc-if value="{{blink}}" hint-placeholder-val="{{ false }}"><animateTransform attributeName="transform" type="scale" values="1 1;1 1;1 0.12;1 1" keyTimes="0;0.95;0.975;1" dur="{{blinkDur}}" repeatCount="indefinite"></animateTransform></sc-if>
<path d="{{e0}}" fill="{{ef}}" stroke="{{es}}" stroke-width="{{ew}}" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="{{e1}}" fill="{{ef}}" stroke="{{es}}" stroke-width="{{ew}}" stroke-linecap="round" stroke-linejoin="round"></path>
</g></g>
</sc-if>
<sc-if value="{{hasImg}}" hint-placeholder-val="{{ false }}">
<defs><clipPath id="{{cid}}"><path d="{{body}}"></path></clipPath></defs>
<g clip-path="{{curl}}"><rect x="0" y="0" width="44" height="44" fill="#2F2F2F"></rect><image href="{{img}}" x="0" y="0" width="44" height="44" preserveAspectRatio="xMidYMid slice"></image></g>
</sc-if>
<sc-if value="{{showDot}}" hint-placeholder-val="{{ false }}">
<circle cx="37" cy="37" r="{{dotR}}" fill="{{dotColor}}" stroke="{{ring}}" stroke-width="{{dotStroke}}"></circle>
</sc-if>
</svg>
</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"color":{"editor":"enum","default":"green","options":["green","blue","red","orange","purple","cyan","pink","yellow","teal","coral"]},"body":{"editor":"enum","default":"cursor","options":["cursor","blob","circle","squircle","capsule","drop","shield","hexagon","diamond","star"]},"state":{"editor":"enum","default":"idle","options":["idle","working","thinking","listening","notifying","curious","alerting","sleeping","drowsy","happy","proud","surprised","sad","confused","searching","excited","suspicious","playful","scared","celebrate","waking","laughing","shy","angry","bored"]},"dot":{"editor":"enum","default":"auto","options":["auto","none","waiting","error","queued","teammate"]},"img":{"editor":"text","default":""},"size":{"editor":"int","default":120,"min":12,"max":320},"ring":{"editor":"color","default":"#111111"},"":{"width":120,"height":120}}'>

renderVals() {
// Flat, eyes-only avatars in the spirit of the original Grok Bot: one solid silhouette + two #141416 eyes. No mouth, no gradient, no outline.

1.21 37.08 9.5 34.12 C7.75 31.86 6.34 29.41 5.25 26.76 C3.55 23.81 3.54 20.19 5.25 17.24 C6.34 14.59 7.75 12.14 9.5 9.88 C11.2 6.92 14.34 5.11 17.75 5.11 C20.58 4.73 23.42 4.73 26.25 5.11 C29.66 5.11 32.8 6.92 34.5 9.88 C36.25 12.14 37.66 14.59 38.75 17.24 C40.45 20.19 40.45 23.81 38.75 26.76 Z", "x": 22, "y": 21, "g": 5.5}, "diamond": {"d": "M28.36 8.86 C31.16 10.58 33.42 12.84 35.14 15.64 C39.08 19.58 39.08 24.42 35.14 28.36 C33.42 31.16 31.16 33.42 28.36 35.14 C24.42 39.08 19.58 39.08 15.64 35.14 C12.84 33.42 10.58 31.16 8.86 28.36 C4.92 24.42 4.92 19.58 8.86 15.64 C10.58 12.84 12.84 10.58 15.64 8.86 C19.58 4.92 24.42 4.92 28.36 8.86 Z", "x": 22, "y": 21.5, "g": 5.5}, "star": {"d": "M25.18 7.49 C25.89 8.5 26.61 9.52 27.33 10.53 C28.58 12.3 30.62 13.78 32.69 14.43 C33.87 14.8 35.06 15.16 36.24 15.53 C39.5 16.54 40.25 18.84 38.21 21.57 C37.47 22.57 36.72 23.56 35.98 24.56 C34.68 26.3 33.91 28.69 33.93 30.86 C33.95 32.1 33.96 33.34 33.98 34.59 C34.02 38 32.07 39.41 28.84 38.32 C27.67 37.92 26.49 37.52 25.31 37.12 C23.26 36.43 20.74 36.43 18.69 37.12 C17.51 37.52 16.33 37.92 15.16 38.32 C11.93 39.41 9.98 38 10.02 34.59 C10.04 33.34 10.05 32.1 10.07 30.86 C10.09 28.69 9.32 26.3 8.02 24.56 C7.28 23.56 6.53 22.57 5.79 21.57 C3.75 18.84 4.5 16.54 7.76 15.53 C8.94 15.16 10.13 14.8 11.31 14.43 C13.38 13.78 15.42 12.3 16.67 10.53 C17.39 9.52 18.11 8.5 18.82 7.49 C20.79 4.71 23.21 4.71 25.18 7.49 Z", "x": 22, "y": 23.5, "g": 5}};
// Grok Bot's 5 exact fills + 5 more at the same saturation / lightness.
const COLORS = { green: '#46a758', blue: '#3f8cff', red: '#e5484d', orange: '#f28a30', purple: '#8e4ec6', cyan: '#2ab0d4', pink: '#e5579a', yellow: '#f2c230', teal: '#22a68f', coral: '#f0694f' };
// 25 state names -> 6 eye variants (dot / closed / happy / wide / aside / half).
const EYE = { idle: 'dot', listening: 'dot', notifying: 'dot', sleeping: 'closed', happy: 'happy', excited: 'happy', celebrate: 'happy', laughing: 'happy', proud: 'happy', playful: 'happy', shy: 'happy', surprised: 'wide', scared: 'wide', alerting: 'wide', working: 'aside', searching: 'aside', thinking: 'aside', curious: 'aside', confused: 'aside', drowsy: 'half', bored: 'half', waking: 'half', suspicious: 'half', sad: 'half', angry: 'half' };

const LEGACY_MOOD = { idle: 'idle', ack: 'surprised', working: 'working', waiting: 'notifying', done: 'happy', failed: 'alerting', error: 'alerting', sleepy: 'sleeping', wink: 'playful', happy: 'happy', sad: 'sad', mad: 'angry', surprised: 'surprised', smug: 'proud', unsure: 'confused', scared: 'scared', love: 'shy', shy: 'shy', sick: 'bored', thinking: 'thinking', queued: 'idle', none: 'idle' };
const MOOD_DOT = { waiting: 'waiting', failed: 'error', error: 'error', queued: 'queued', notifying: 'waiting', alerting: 'error' };
const DOTC = { waiting: '#FF9800', error: '#FF5667' };
const p = this.props;
const s = Number(p.size ?? 120) || 120;
const small = s < 28;
let cname = p.color || 'green';
if (cname[0] === '#') cname = LEGACY_COLOR[cname.toUpperCase()] || 'green';
const fill = COLORS[cname] || COLORS.green;
const bodyId = B[p.body] ? p.body : (LEGACY_SHAPE[p.body] || 'cursor');
const b = B[bodyId];
const raw = p.state || p.mood || 'idle';
const st = EYE[raw] ? raw : (LEGACY_MOOD[raw] || 'idle');
const v = EYE[st] || 'dot';
const n = (x) => Math.round(x * 100) / 100;
const dotP = (x, y, r) => 'M' + n(x - r) + ' ' + n(y) + ' a' + r + ' ' + r + ' 0 1 0 ' + n(2 * r) + ' 0 a' + r + ' ' + r + ' 0 1 0 ' + n(-2 * r) + ' 0 Z';
const r = small ? 3.1 : 2.6, g = b.g;
let e0, e1, line = false;
if (v === 'wide') { const R = small ? 3.7 : 3.4; e0 = dotP(-g, 0, R); e1 = dotP(g, 0, R); }

else if (v === 'half') { const r2 = small ? 3.4 : 3.1; const H = (x) => 'M' + n(x - r2) + ' -0.4 A' + r2 + ' ' + r2 + ' 0 0 0 ' + n(x + r2) + ' -0.4 Z'; e0 = H(-g); e1 = H(g); }
else if (v === 'happy') { line = true; const A = (x) => 'M' + n(x - 2.7) + ' 1.1 Q' + n(x) + ' -2.7 ' + n(x + 2.7) + ' 1.1'; e0 = A(-g); e1 = A(g); }
else if (v === 'closed') { line = true; const C = (x) => 'M' + n(x - 2.7) + ' 0.3 Q' + n(x) + ' 2.4 ' + n(x + 2.7) + ' 0.3'; e0 = C(-g); e1 = C(g); }
else { e0 = dotP(-g, 0, r); e1 = dotP(g, 0, r); }
if (!this.uid) this.uid = 'mx' + Math.random().toString(36).slice(2, 9);
let dot = p.dot || 'auto';
if (dot === 'auto') dot = MOOD_DOT[raw] || MOOD_DOT[st] || 'none';
const SAMPLE = 'data:image/svg+xml;utf8,' + encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 84 84'><rect width='84' height='84' fill='#F2B37A'/><rect width='84' height='46' fill='#F7CFA0'/><circle cx='66' cy='18' r='9' fill='#FFF1D6'/><path d='M0 52 L18 36 L32 46 L50 30 L84 54 L84 84 L0 84 Z' fill='#C9845A'/><path d='M18 84 C18 66 28 60 42 60 C56 60 66 66 66 84 Z' fill='#2E4A6B'/><rect x='37' y='50' width='10' height='12' rx='4' fill='#B97A55'/><ellipse cx='42' cy='41' rx='12' ry='14' fill='#E3A57E'/><path d='M29 39 C29 26 36 23 42 23 C50 23 56 28 55 40 C52 33 46 31 42 31 C36 31 32 34 29 39 Z' fill='#3A2A22'/></svg>");
