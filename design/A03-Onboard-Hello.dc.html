<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<title>首次設定 1/2 接上 AI</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;font-synthesis:none;background:#070707}
h1,h2,h3,h4,p{font-weight:400;margin:0}
button,input,textarea{font-family:inherit}
input::placeholder{color:#FCFCFC90}
a{color:#7FC0FF;text-decoration:none}a:hover{color:#A9D4FF}
@keyframes xspin{to{transform:rotate(360deg)}}
@media (max-width: 640px){nav[aria-label="側欄"],main{min-height:0 !important}}
@keyframes xslide{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
</style>
</helmet>
<div style="min-height: 900px; box-sizing: border-box; padding: 16px 16px 32px; background: #070707; color: #FCFCFC; font-family: 'Huninn', 'PingFang TC', 'Noto Sans TC', sans-serif; font-size: 14.5px; line-height: 1.6; display: flex; flex-direction: column; align-items: center; gap: 16px">

<div style="width: 100%; display: flex; align-items: center; flex-wrap: wrap; gap: 8px; min-height: 40px; padding: 0 8px; box-sizing: border-box">
<dc-import name="Mochi" size="24" pose="lazy" hint-size="24px,24px"></dc-import>
<span style="font-size: 16px; flex: 1">XBot</span>
<span style="display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; background: rgba(16,132,254,.2); color: #7FC0FF; font-size: 12.5px; white-space: nowrap"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#7FC0FF" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z"></path><path d="M20 2v4"></path><path d="M22 4h-4"></path><path d="M2 20a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"></path></svg>簡化：6 步 → 2 步</span>
</div>

<main style="flex: 1; width: 100%; display: flex; align-items: center; justify-content: center">
<div style="width: 100%; max-width: 620px; box-sizing: border-box; padding: 32px; border-radius: 18px; background: #111111; border: 1px solid #262626; display: flex; flex-direction: column; gap: 18px">

<div style="display: flex; align-items: center; gap: 10px">
<span style="font-size: 13px; color: #FCFCFC90">步驟 1 / 2</span>
<span style="display: flex; gap: 4px"><span style="width: 28px; height: 4px; border-radius: 4px; background: #FCFCFC"></span><span style="width: 28px; height: 4px; border-radius: 4px; background: #333333"></span></span>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="font-size: 24px; line-height: 1.3">接上 AI</h1>
<p style="font-size: 14.5px; color: #FCFCFC99">Bot 用你已經登入的 AI 來工作。挑一個就好，之後可以再加。</p>
</div>

<sc-if value="{{detecting}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: #FCFCFC99"><span style="display: flex; animation: xspin 1.2s linear infinite"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#7FC0FF" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg></span>正在找這台電腦上的 AI 工具…</span>
<sc-for list="{{skeleton}}" as="k" hint-placeholder-count="3">
<div style="height: 64px; border-radius: 14px; background: #1C1C1C; display: flex; align-items: center; gap: 12px; padding: 0 16px"><span style="width: 36px; height: 36px; border-radius: 10px; background: #262626"></span><span style="display: flex; flex-direction: column; gap: 6px"><span style="width: {{k.w}}px; height: 10px; border-radius: 4px; background: #262626"></span><span style="width: 160px; height: 8px; border-radius: 4px; background: #222222"></span></span></div>
</sc-for>
</div>
</sc-if>

<sc-if value="{{found}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 12.5px; color: #FCFCFC90">在這台電腦上找到 4 個</span>
<sc-for list="{{engines}}" as="e" hint-placeholder-count="4">
<div style="min-height: 64px; box-sizing: border-box; border-radius: 14px; background: #262626; display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 14px">
<span style="width: 36px; height: 36px; flex: none; border-radius: 10px; background: #2F2F2F; color: #FCFCFC; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><sc-for list="{{e.icon}}" as="d" hint-placeholder-count="2"><path d="{{d}}"></path></sc-for></svg></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<span style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap"><span style="font-size: 15px">{{e.name}}</span><sc-if value="{{e.rec}}" hint-placeholder-val="{{ false }}"><span style="height: 20px; padding: 0 8px; border-radius: 999px; background: rgba(16,132,254,.2); color: #7FC0FF; font-size: 11.5px; display: inline-flex; align-items: center">建議</span></sc-if></span>
<span style="font-size: 13px; color: #FCFCFC99">{{e.sub}}</span>
</span>
<a href="A04-Onboard-Engines.dc.html" style="height: 36px; flex: none; padding: 0 16px; border-radius: 999px; background: {{e.btnBg}}; color: {{e.btnInk}}; font-size: 14px; display: inline-flex; align-items: center">用這個</a>
</div>
</sc-for>
</div>
<button type="button" aria-expanded="{{keyOpen}}" onClick="{{toggleKey}}" style="min-height: 44px; display: flex; align-items: center; gap: 10px; border: 0; padding: 0 4px; background: transparent; color: #FCFCFC99; font-size: 13.5px; cursor: pointer; text-align: left"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"></path><path d="M16 7.5a0.5 0.5 0 1 0 1 0a0.5 0.5 0 1 0 -1 0"></path></svg><span style="flex: 1">改用 API 金鑰</span><span style="display: flex; transform: rotate({{keyRot}}deg)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="m9 18 6-6-6-6"></path></svg></span></button>
</sc-if>

<sc-if value="{{showKey}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 10px">
<sc-if value="{{none}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 14px; background: #191919">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FCFCFC99" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M2 12a10 10 0 1 0 20 0a10 10 0 1 0 -20 0"></path><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg>
<span style="font-size: 13.5px; color: #FCFCFC99; line-height: 1.6">這台電腦上沒有找到已登入的 Claude Code、Codex、Grok 或本機模型。貼上一把 API 金鑰也可以開始。</span>
</div>
</sc-if>
<label for="apikey" style="font-size: 13px; color: #FCFCFC99">API 金鑰</label>
<div style="display: flex; gap: 8px">
<input id="apikey" type="password" value="{{key}}" onInput="{{typeKey}}" placeholder="貼上金鑰，例如 sk-ant-…" style="flex: 1; min-width: 0; height: 40px; box-sizing: border-box; padding: 0 12px; border-radius: 10px; background: #191919; border: 1px solid #333333; color: #FCFCFC; font-size: 14.5px; outline: 0">
<a href="A04-Onboard-Engines.dc.html" style="height: 40px; flex: none; padding: 0 18px; border-radius: 999px; background: #FCFCFC; color: #070707; font-size: 14.5px; display: inline-flex; align-items: center">連接</a>
</div>
<span style="display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: {{keyHintInk}}">{{keyHint}}</span>
</div>
</sc-if>

<div style="display: flex; align-items: center; gap: 8px; padding-top: 14px; border-top: 1px solid #262626">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FCFCFC90" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M5 11h14a2 2 0 0 1 2 2v7a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-7a2 2 0 0 1 2 -2Z"></path><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
<span style="flex: 1; font-size: 12.5px; color: #FCFCFC90">金鑰只存在這台主機，不會傳給 Bot 的電腦。</span>
</div>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"scenario":{"editor":"enum","default":"found","options":["found","detecting","none"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { keyOpen: false, key: '' };
}
renderVals() {
const sc = this.props.scenario ?? 'found';
const s = this.state;
const I = { asterisk: ["M12 5v14", "m18.065 8.496-12.125 7", "m5.94 8.504 12.125 7"], code: ["m18 16 4-4-4-4", "m6 8-4 4 4 4", "m14.5 4-5 16"], zap: ["M15.914 4a1.5 1.5 0 00-2.474-1.561l-9 9A1.5 1.5 0 005.5 14h4.002a.5.5 0 01.471.666L8.086 20a1.5 1.5 0 002.475 1.56l9-9A1.5 1.5 0 0018.5 10h-3.997a.5.5 0 01-.472-.667z"], cpu: ["M12 20v2", "M12 2v2", "M17 20v2", "M17 2v2", "M2 12h2", "M2 17h2", "M2 7h2", "M20 12h2", "M20 17h2", "M20 7h2", "M7 20v2", "M7 2v2", "M6 4h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2v-12a2 2 0 0 1 2 -2Z", "M9 8h6a1 1 0 0 1 1 1v6a1 1 0 0 1 -1 1h-6a1 1 0 0 1 -1 -1v-6a1 1 0 0 1 1 -1Z"] };
const E = (name, sub, icon, rec) => ({ name, sub, icon: I[icon], rec, btnBg: rec ? '#FCFCFC' : '#2F2F2F', btnInk: rec ? '#070707' : '#FCFCFC' });
const looksAnthropic = s.key.indexOf('sk-ant') === 0;
return {
detecting: sc === 'detecting',
found: sc === 'found',
none: sc === 'none',
showKey: sc === 'none' || (sc === 'found' && s.keyOpen),
keyOpen: s.keyOpen,
keyRot: s.keyOpen ? 90 : 0,
toggleKey: () => this.setState({ keyOpen: !s.keyOpen }),
key: s.key,
typeKey: (e) => this.setState({ key: e.target.value }),
keyHint: looksAnthropic ? '認出是 Anthropic 的金鑰，會先用 Claude Sonnet 5.5' : '貼上後會自動認出是哪一家，並選好建議的模型。',
keyHintInk: looksAnthropic ? '#38D591' : '#FCFCFC90',
skeleton: [{ w: 120 }, { w: 90 }, { w: 140 }],
engines: [
E('Claude Code', '已登入 · 用你的 Claude 訂閱', 'asterisk', true),
E('Codex', '已登入 · 用你的 ChatGPT 訂閱', 'code', false),
E('Grok', '已登入 · 用你的 SuperGrok 訂閱', 'zap', false),
E('本機模型', 'LM Studio · 找到 2 個模型，不用連網', 'cpu', false)
]
};
}
}
</script>
</body>
</html>
