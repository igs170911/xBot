<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<title>手機：待你核定</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;font-synthesis:none;background:#070707}
a{color:#7FC0FF;text-decoration:none}a:hover{color:#A8D4FF}
button{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #070707; color: #FCFCFC; font-family: 'Huninn', 'PingFang TC', 'Noto Sans TC', sans-serif; font-size: 15px; line-height: 1.5">

<div aria-hidden="true" style="position: absolute; inset: 0; display: flex; flex-direction: column">
<div style="height: 47px; flex: none"></div>
<div style="flex: none; padding: 4px 16px 0; display: flex; flex-direction: column; align-items: center; gap: 6px">
<div style="width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 8px">
<div style="display: flex; align-items: center; gap: 8px">
<span style="height: 44px; padding: 0 8px; box-sizing: border-box; border-radius: 999px; background: #191919; border: 1px solid #333333; display: flex; align-items: center; gap: 4px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; display: block"><path d="m15 18-6-6 6-6"></path></svg><span style="min-width: 22px; height: 22px; border-radius: 999px; background: #2F2F2F; font-size: 12.5px; line-height: 22px; text-align: center">2</span></span>
<span style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 999px; background: #191919; border: 1px solid #333333; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; display: block"><path d="M13.832 16.568a1 1 0 0 0 1.213-.303l.355-.465A2 2 0 0 1 17 15h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2A18 18 0 0 1 2 4a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v3a2 2 0 0 1-.8 1.6l-.468.351a1 1 0 0 0-.292 1.233 14 14 0 0 0 6.392 6.384"></path></svg></span>
</div>
<dc-import name="Avatar" color="yellow" body="hexagon" state="notifying" dot="waiting" ring="#070707" size="44" hint-size="44px,44px"></dc-import>
<div style="display: flex; align-items: center; justify-content: flex-end; gap: 8px">
<span style="height: 44px; padding: 0 12px; box-sizing: border-box; border-radius: 999px; background: #191919; border: 1px solid #333333; display: flex; align-items: center; gap: 6px; font-size: 14.5px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; display: block"><path d="M16 10a2 2 0 0 1-2 2H6.828a2 2 0 0 0-1.414.586l-2.202 2.202A.71.71 0 0 1 2 14.286V4a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path><path d="M20 9a2 2 0 0 1 2 2v10.286a.71.71 0 0 1-1.212.502l-2.202-2.202A2 2 0 0 0 17.172 19H10a2 2 0 0 1-2-2v-1"></path></svg>對話串</span>
<span style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 999px; background: #191919; border: 1px solid #333333; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; display: block"><path d="M4 3h16a2 2 0 0 1 2 2v10a2 2 0 0 1 -2 2h-16a2 2 0 0 1 -2 -2v-10a2 2 0 0 1 2 -2Z"></path><path d="M8 21L16 21"></path><path d="M12 17L12 21"></path></svg></span>
</div>
</div>
<span style="height: 44px; padding: 0 14px 0 16px; box-sizing: border-box; border-radius: 999px; background: #191919; border: 1px solid #333333; display: flex; align-items: center; gap: 6px"><span style="font-size: 15.5px">帳房</span><span style="font-size: 13.5px; color: #FCFCFC99">10 月帳單</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FCFCFC99" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; display: block"><path d="m6 9 6 6 6-6"></path></svg></span>
</div>
<div style="padding: 20px 16px 0; display: flex; flex-direction: column; gap: 8px">
<p style="margin: 0; text-align: center; font-size: 12.5px; color: #FCFCFC90">今天 下午 2:52</p>
<div style="align-self: flex-start; max-width: 75%; background: #262626; border-radius: 20px; padding: 10px 16px">小秘交辦：付 10 月的廣告費。</div>
<span style="align-self: flex-start; height: 30px; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; border: 1px solid #333333; border-radius: 999px; font-size: 13px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#38D591" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; display: block"><path d="M20 6 9 17l-5-5"></path></svg>來自小秘的請求 · 第 2/6 棒</span>
<div style="align-self: flex-start; max-width: 75%; background: #262626; border-radius: 20px; padding: 10px 16px">帳單核對過了，跟上個月一樣。付款前先問你。</div>
</div>
</div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,.62)"></div>

<section role="dialog" aria-modal="true" aria-labelledby="sheet-title" style="position: absolute; left: 0; right: 0; bottom: 0; background: #111111; border-radius: 20px 20px 0 0; border-top: 1px solid #262626; padding: 0 16px 34px; display: flex; flex-direction: column">
<div aria-hidden="true" style="height: 20px; display: flex; align-items: center; justify-content: center"><span style="width: 36px; height: 5px; border-radius: 9px; background: #3D3D3D"></span></div>
<span style="position: absolute; top: 14px; right: 16px"><span style="height: 24px; display: inline-flex; align-items: center; gap: 4px; padding: 0 9px; border-radius: 999px; background: rgba(16,132,254,.2); color: #7FC0FF; font-size: 12px; white-space: nowrap; flex: none"><span style="display: flex"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; display: block"><path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z"></path><path d="M20 2v4"></path><path d="M22 4h-4"></path><path d="M2 20a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"></path></svg></span>簡化：3 步 → 1 步</span></span>

<div style="display: flex; align-items: center; gap: 12px; padding: 4px 0 14px">
<dc-import name="Avatar" color="yellow" body="hexagon" state="{{avState}}" dot="{{avDot}}" ring="#111111" size="44" hint-size="44px,44px"></dc-import>
<div style="flex: 1; min-width: 0">
<div style="display: flex; align-items: center; gap: 8px"><h2 id="sheet-title" style="margin: 0; font-size: 17px; font-weight: 400">帳房想付款</h2><span style="font-size: 12px; line-height: 20px; padding: 0 8px; border-radius: 999px; background: {{tagBg}}; color: {{tagInk}}">{{tag}}</span></div>
<div style="font-size: 13px; color: #FCFCFC99">新增支出只有你能決定 · 小秘交辦的工作</div>
</div>
</div>

<dl style="margin: 0; background: #262626; border-radius: 14px; padding: 0 14px">
<div style="height: 44px; display: flex; align-items: center; gap: 12px"><dt style="width: 72px; font-size: 14px; color: #FCFCFC99">金額</dt><dd style="margin: 0; font-size: 17px">NT$1,280</dd></div>
<div style="height: 44px; display: flex; align-items: center; gap: 12px; border-top: 1px solid #333333"><dt style="width: 72px; font-size: 14px; color: #FCFCFC99">付給</dt><dd style="margin: 0; font-size: 15px">晨光廣告</dd></div>
<div style="height: 44px; display: flex; align-items: center; gap: 12px; border-top: 1px solid #333333"><dt style="width: 72px; font-size: 14px; color: #FCFCFC99">用途</dt><dd style="margin: 0; font-size: 15px">10 月廣告費（跟 9 月相同）</dd></div>
<div style="height: 44px; display: flex; align-items: center; gap: 12px; border-top: 1px solid #333333"><dt style="width: 72px; font-size: 14px; color: #FCFCFC99">付款方式</dt><dd style="margin: 0; font-size: 15px">公司信用卡 末四碼 4821</dd></div>
</dl>

<div style="padding: 12px 2px 16px; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: baseline; gap: 6px; font-size: 13px; color: #FCFCFC99"><span style="flex: 1">本月花費，付完是 NT$5,880</span><span>上限 NT$8,000</span></div>
<span role="img" aria-label="付完會用掉本月上限的 74%" style="height: 4px; border-radius: 9px; background: #333333; display: flex; overflow: hidden"><span style="width: 57.5%; background: #1084FE"></span><span style="width: 16%; background: #7FC0FF"></span></span>
</div>

<sc-if value="{{open}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 8px">
<button type="button" onClick="{{allow}}" style="height: 48px; border: 0; border-radius: 999px; background: #FCFCFC; color: #070707; font-size: 15.5px; cursor: pointer">允許這次</button>
<button type="button" onClick="{{reject}}" style="height: 48px; border: 0; border-radius: 999px; background: #2F2F2F; color: #FCFCFC; font-size: 15.5px; cursor: pointer">退回</button>
</div>
</sc-if>
<sc-if value="{{closed}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 8px">
<div role="status" style="height: 48px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; color: {{doneInk}}"><span style="display: flex"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; display: block"><path d="M2 12a10 10 0 1 0 20 0a10 10 0 1 0 -20 0"></path><path d="m16 9-5.5 5.5L8 12"></path></svg></span>{{doneText}}</div>
<button type="button" onClick="{{undo}}" style="height: 48px; border: 1px solid #333333; border-radius: 999px; background: transparent; color: #FCFCFC; font-size: 15.5px; cursor: pointer">復原</button>
</div>
</sc-if>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const d = (this.state && this.state.d) || '';
return {
open: !d,
closed: !!d,
tag: d ? '已處理' : '待你核定',
tagBg: d ? '#2F2F2F' : 'rgba(255,152,0,.16)',
tagInk: d ? '#FCFCFC99' : '#FFB547',
avState: d === 'ok' ? 'happy' : (d === 'no' ? 'sad' : 'notifying'),
avDot: d ? 'none' : 'waiting',
doneText: d === 'ok' ? '已允許這次 · 帳房開始付款' : '已退回 · 帳房會告訴小秘',
doneInk: d === 'ok' ? '#38D591' : '#FCFCFC99',
allow: () => this.setState({ d: 'ok' }),
reject: () => this.setState({ d: 'no' }),
undo: () => this.setState({ d: '' })
};
}
}
</script>
</body>
</html>
