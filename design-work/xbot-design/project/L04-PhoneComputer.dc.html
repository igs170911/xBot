<div style="flex: none; margin-top: 12px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; background: #191919; border-radius: 14px; padding: 4px">
<button type="button" aria-pressed="{{kbOn}}" onClick="{{toggleKb}}" style="height: 44px; border: 0; border-radius: 10px; background: {{kbBg}}; color: #FCFCFC; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14.5px; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; display: block"><path d="M10 8h.01"></path><path d="M12 12h.01"></path><path d="M14 8h.01"></path><path d="M16 12h.01"></path><path d="M18 8h.01"></path><path d="M6 8h.01"></path><path d="M7 16h10"></path><path d="M8 12h.01"></path><path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-16a2 2 0 0 1 -2 -2v-12a2 2 0 0 1 2 -2Z"></path></svg>鍵盤</button>
<button type="button" style="height: 44px; border: 0; border-radius: 10px; background: transparent; color: #FCFCFC; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14.5px; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; display: block"><path d="M11 14h10"></path><path d="M16 4h2a2 2 0 0 1 2 2v1.344"></path><path d="m17 18 4-4-4-4"></path><path d="M8 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 1.793-1.113"></path><path d="M9 2h6a1 1 0 0 1 1 1v2a1 1 0 0 1 -1 1h-6a1 1 0 0 1 -1 -1v-2a1 1 0 0 1 1 -1Z"></path></svg>貼上</button>
<button type="button" aria-expanded="{{moreOn}}" onClick="{{toggleMore}}" style="height: 44px; border: 0; border-radius: 10px; background: {{moreBg}}; color: #FCFCFC; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14.5px; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; display: block"><path d="M11 12a1 1 0 1 0 2 0a1 1 0 1 0 -2 0"></path><path d="M18 12a1 1 0 1 0 2 0a1 1 0 1 0 -2 0"></path><path d="M4 12a1 1 0 1 0 2 0a1 1 0 1 0 -2 0"></path></svg>更多</button>

<sc-if value="{{moreOn}}" hint-placeholder-val="{{ true }}">
<div style="flex: none; margin-top: 8px; background: #191919; border-radius: 14px; padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 12.5px; color: #FCFCFC90">特殊按鍵（按一下送出，Ctrl／Alt 會停住等下一鍵）</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{keys}}" as="k" hint-placeholder-count="8">
<button type="button" aria-label="{{k.label}}" aria-pressed="{{k.on}}" onClick="{{k.press}}" style="height: 44px; border: 0; border-radius: 10px; background: {{k.bg}}; color: {{k.ink}}; font-family: 'JetBrains Mono', monospace; font-size: {{k.fs}}; cursor: pointer">{{k.t}}</button>
</sc-for>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<button type="button" style="height: 44px; border: 1px solid #333333; border-radius: 10px; background: transparent; color: #FCFCFC; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; display: block"><path d="M15 3h6v6"></path><path d="m21 3-7 7"></path><path d="m3 21 7-7"></path><path d="M9 21H3v-6"></path></svg>全螢幕</button>
<button type="button" style="height: 44px; border: 1px solid #333333; border-radius: 10px; background: transparent; color: #FCFCFC; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; display: block"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path><path d="M8 16H3v5"></path></svg>重新連線</button>
</div>
</div>
</sc-if>

<div style="flex: 1"></div>
<sc-if value="{{working}}" hint-placeholder-val="{{ true }}">
<p style="flex: none; margin: 0 0 10px; font-size: 13px; color: #FCFCFC99; text-align: center; line-height: 1.55">說明選填。不填時會告訴小編：<br>「我剛剛在電腦上操作過，請從目前畫面繼續。」</p>
<button type="button" onClick="{{giveBack}}" style="flex: none; height: 48px; border: 0; border-radius: 999px; background: #FCFCFC; color: #070707; font-size: 15.5px; cursor: pointer">完成，交還給小編</button>
</sc-if>
<sc-if value="{{returned}}" hint-placeholder-val="{{ false }}">
<div role="status" style="flex: none; height: 48px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; color: #38D591"><span style="display: flex"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; display: block"><path d="M2 12a10 10 0 1 0 20 0a10 10 0 1 0 -20 0"></path><path d="m16 9-5.5 5.5L8 12"></path></svg></span>已交還 · 小編繼續發文</div>
</sc-if>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const st = this.state || {};
const more = st.more !== false;
const kb = !!st.kb;
const done = !!st.done;
const held = st.held || '';
const keys = [
{ t: 'Esc', label: 'Esc' }, { t: 'Tab', label: 'Tab' }, { t: 'Ctrl', label: 'Ctrl', sticky: true }, { t: 'Alt', label: 'Alt', sticky: true },
{ t: '←', label: '左' }, { t: '↑', label: '上' }, { t: '↓', label: '下' }, { t: '→', label: '右' }
].map((k) => {
const on = !!k.sticky && held === k.t;
return Object.assign({}, k, { on, fs: k.t.length === 1 ? '18px' : '14px', bg: on ? '#1084FE' : '#2F2F2F', ink: '#FCFCFC', press: () => this.setState({ held: k.sticky ? (held === k.t ? '' : k.t) : '' }) });
});
return {
keys,
moreOn: more,
moreBg: more ? '#2F2F2F' : 'transparent',
toggleMore: () => this.setState({ more: !more }),
kbOn: kb,
kbBg: kb ? '#2F2F2F' : 'transparent',
toggleKb: () => this.setState({ kb: !kb }),
working: !done,
returned: done,
giveBack: () => this.setState({ done: true }),
tagText: done ? '已交還給小編' : '你正在操作 · 小編在等你',
tagBg: done ? 'rgba(56,213,145,.14)' : 'rgba(255,152,0,.16)',
tagInk: done ? '#38D591' : '#FFB547'
};
}
}
</script>
