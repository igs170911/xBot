<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<title>電腦面板：資料</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;font-synthesis:none;background:#070707}
a{color:#7FC0FF;text-decoration:none}
button{font:inherit}
</style>
</helmet>
<div style="min-height: 960px; display: flex; flex-wrap: wrap; background: #070707; color: #FCFCFC; font-family: 'Huninn', 'PingFang TC', 'Noto Sans TC', sans-serif; font-size: 15px; line-height: 1.6">

<div style="flex: 1 1 300px; max-width: 300px; background: #111111">
<dc-import name="Sidebar" active="shujumiao" theme="dark" hint-size="100%,960px"></dc-import>
</div>

<main style="flex: 999 1 420px; min-width: 0; height: 960px; display: flex; flex-direction: column">
<header style="height: 56px; flex: none; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 20px">
<dc-import name="Avatar" color="purple" body="diamond" state="idle" dot="queued" ring="#070707" size="26" hint-size="26px,26px"></dc-import>
<span style="font-size: 16px; margin-left: 2px; white-space: nowrap">數據喵</span>
<span style="font-size: 13px; color: #FCFCFC99; white-space: nowrap">排隊中</span>
<span style="flex: 1"></span>
<button type="button" style="height: 32px; padding: 0 12px; border: 1px solid #333333; border-radius: 999px; background: transparent; color: #FCFCFC; font-size: 13.5px; display: flex; align-items: center; gap: 4px; cursor: pointer; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{I.plus}}"></path></svg>對話串</button>
<button type="button" aria-haspopup="listbox" style="height: 32px; padding: 0 10px 0 12px; border: 0; border-radius: 999px; background: #262626; color: #FCFCFC; font-size: 13.5px; display: flex; align-items: center; gap: 4px; cursor: pointer; white-space: nowrap">Claude Sonnet 5.5<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FCFCFC99" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{I.chevronDown}}"></path></svg></button>
<button type="button" aria-label="電腦（開啟中）" aria-pressed="true" style="width: 36px; height: 36px; border: 0; border-radius: 10px; background: #2F2F2F; color: #FCFCFC; display: flex; align-items: center; justify-content: center; cursor: pointer; flex: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{I.monitor}}"></path></svg></button>
<button type="button" aria-label="更多" style="width: 36px; height: 36px; border: 0; border-radius: 10px; background: transparent; color: #FCFCFC99; display: flex; align-items: center; justify-content: center; cursor: pointer; flex: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{I.ellipsis}}"></path></svg></button>
</header>

<div style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 12px; padding: 12px 24px 0">
<span style="align-self: center; font-size: 12.5px; color: #FCFCFC90">昨天 下午 4:30</span>
<div style="align-self: flex-end; max-width: 75%; background: #5A5A5A; border-radius: 20px; padding: 10px 16px; font-size: 14.5px">上個月哪幾項商品退貨率最高？</div>
<span style="align-self: flex-start; display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border: 1px solid #333333; border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; color: #FCFCFCcc"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#38D591" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{I.check}}"></path></svg>sql_query</span>
<div style="align-self: flex-start; max-width: 88%; background: #262626; border-radius: 20px; padding: 12px 12px 12px 16px; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 14.5px; line-height: 1.65; padding-right: 4px">九月退貨率最高的是防水托特包（14.2%），其次是雙肩後背包（11.8%）。查詢放在右邊的「資料」，可以改條件再跑。</span>
<span style="border-radius: 12px; background: #2F2F2F; padding: 8px 10px; display: flex; align-items: center; gap: 10px">
<span style="width: 32px; height: 32px; border-radius: 8px; background: #191919; color: #7FC0FF; display: flex; align-items: center; justify-content: center; flex: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{I.database}}"></path></svg></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.35"><span style="font-size: 14px">退貨率前 8 名</span><span style="font-size: 12.5px; color: #FCFCFC99">SQL · 3 張表 · 已在資料分頁打開</span></span>
</span>
</div>
<span style="align-self: center; font-size: 12.5px; color: #FCFCFC90">今天 上午 9:05</span>
<div style="align-self: flex-end; max-width: 75%; background: #5A5A5A; border-radius: 20px; padding: 10px 16px; font-size: 14.5px">週報的資料也幫我備好</div>
<span style="align-self: flex-start; display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 12px; border: 1px solid #333333; border-radius: 999px; font-size: 12.5px; color: #FCFCFCcc"><span style="width: 7px; height: 7px; border-radius: 9px; background: #8A8A8A"></span>排隊中 · 小秘的週報整理先做，前面還有 1 件</span>
</div>

<div style="flex: none; padding: 12px 24px 20px">
<div style="height: 52px; box-sizing: border-box; border-radius: 999px; background: #2F2F2F; display: flex; align-items: center; gap: 6px; padding: 0 9px 0 8px">
<button type="button" aria-label="加入檔案" style="width: 36px; height: 36px; border: 0; border-radius: 999px; background: transparent; color: #FCFCFC99; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{I.plus}}"></path></svg></button>
<label style="flex: 1; min-width: 0; display: flex"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">訊息</span><input type="text" placeholder="交代數據喵…" style="flex: 1; min-width: 0; height: 40px; border: 0; background: transparent; color: #FCFCFC; font: inherit; font-size: 15px; outline: none"></label>
<button type="button" aria-label="語音輸入" style="width: 36px; height: 36px; border: 0; border-radius: 999px; background: transparent; color: #FCFCFC99; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{I.mic}}"></path></svg></button>
<button type="button" aria-label="送出" style="width: 34px; height: 34px; border: 0; border-radius: 999px; background: #FCFCFC; color: #070707; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{I.arrowUp}}"></path></svg></button>
</div>
</div>
</main>

<aside aria-label="數據喵的電腦" style="flex: 0 1 600px; min-width: 0; height: 960px; box-sizing: border-box; background: #111111; border-left: 1px solid #262626; display: flex; flex-direction: column">
<div style="height: 56px; flex: none; display: flex; align-items: center; padding: 0 10px">
<button type="button" aria-label="電腦設定" style="width: 36px; height: 36px; border: 0; border-radius: 10px; background: transparent; color: #FCFCFC99; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{I.settings}}"></path></svg></button>
<span style="flex: 1; text-align: center; font-size: 16px">數據喵的電腦</span>
<button type="button" aria-label="關閉電腦面板" style="width: 36px; height: 36px; border: 0; border-radius: 10px; background: transparent; color: #FCFCFC99; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{I.x}}"></path></svg></button>
</div>

<div role="tablist" aria-label="電腦面板" style="margin: 0 16px; flex: none; display: flex; padding: 3px; gap: 2px; border-radius: 10px; background: #191919">
<a href="E01-Computer.dc.html" role="tab" aria-selected="false" style="flex: 1; height: 32px; border-radius: 8px; color: #FCFCFC99; font-size: 13.5px; display: flex; align-items: center; justify-content: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{I.monitor}}"></path></svg>畫面</a>
<a href="E06-Browser.dc.html" role="tab" aria-selected="false" style="flex: 1; height: 32px; border-radius: 8px; color: #FCFCFC99; font-size: 13.5px; display: flex; align-items: center; justify-content: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{I.globe}}"></path></svg>瀏覽器</a>
<a href="E07-Files.dc.html" role="tab" aria-selected="false" style="flex: 1; height: 32px; border-radius: 8px; color: #FCFCFC99; font-size: 13.5px; display: flex; align-items: center; justify-content: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{I.folder}}"></path></svg>檔案</a>
<span role="tab" aria-selected="true" style="flex: 1; height: 32px; border-radius: 8px; background: #2F2F2F; color: #FCFCFC; font-size: 13.5px; display: flex; align-items: center; justify-content: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{I.database}}"></path></svg>資料</span>
</div>

<div style="flex: 1; min-height: 0; padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 10px; position: relative">

<div style="display: flex; gap: 8px; flex: none">
<sc-for list="{{sources}}" as="s" hint-placeholder-count="3">
<button type="button" style="flex: 1 1 0; min-width: 0; height: 44px; border: 0; border-radius: 12px; background: #191919; color: #FCFCFC; padding: 0 10px; display: flex; align-items: center; gap: 8px; text-align: left; cursor: pointer">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FCFCFC99" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="{{I.table}}"></path></svg>
<span style="min-width: 0; display: flex; flex-direction: column; line-height: 1.3"><span style="font-family: 'JetBrains Mono', monospace; font-size: 12.5px">{{s.name}}</span><span style="font-size: 11.5px; color: #FCFCFC99">{{s.rows}}</span></span>
</button>
</sc-for>
<button type="button" style="flex: none; height: 44px; padding: 0 12px; border: 1px dashed #333333; border-radius: 12px; background: transparent; color: #FCFCFC99; font-size: 13px; display: flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{I.plus}}"></path></svg>載入資料</button>
</div>

<div style="flex: none; background: #191919; border-radius: 12px; display: flex; flex-direction: column">
<div style="height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 14px; border-bottom: 1px solid #262626">
<span style="flex: 1; font-size: 13.5px">退貨率前 8 名</span>
<button type="button" aria-label="查詢紀錄" style="width: 32px; height: 32px; border: 0; border-radius: 8px; background: transparent; color: #FCFCFC99; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{I.history}}"></path></svg></button>
<button type="button" style="height: 30px; padding: 0 12px; border: 0; border-radius: 999px; background: #FCFCFC; color: #070707; font-size: 13px; display: flex; align-items: center; gap: 6px; cursor: pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{I.play}}"></path></svg>執行<span style="font-size: 12px; color: #07070799">⌘↵</span></button>
</div>
<div role="textbox" aria-label="SQL" aria-multiline="true" style="padding: 8px 0; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; line-height: 20px">
<sc-for list="{{sql}}" as="l" hint-placeholder-count="10">
<div style="display: flex; white-space: pre"><span style="width: 36px; flex: none; text-align: right; padding-right: 12px; color: #FCFCFC50">{{l.n}}</span><sc-for list="{{l.tk}}" as="t" hint-placeholder-count="3"><span style="color: {{t.c}}">{{t.t}}</span></sc-for></div>
</sc-for>
</div>
</div>

<div style="flex: none; height: 36px; display: flex; align-items: center; gap: 10px; position: relative">
<span style="display: flex; align-items: center; gap: 6px; font-size: 13.5px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#38D591" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{I.check}}"></path></svg>結果</span>
<span style="flex: 1; font-size: 12.5px; color: #FCFCFC99">8 列 · 0.4 秒 · 9 月訂單</span>
<button type="button" aria-haspopup="menu" aria-expanded="{{menuOpen}}" onClick="{{toggleMenu}}" style="height: 30px; padding: 0 8px 0 12px; border: 0; border-radius: 999px; background: {{menuBtnBg}}; color: #FCFCFC; font-size: 13px; display: flex; align-items: center; gap: 4px; cursor: pointer"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{I.download}}"></path></svg>匯出<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FCFCFC99" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{I.chevronDown}}"></path></svg></button>
<sc-if value="{{menuOpenB}}" hint-placeholder-val="{{ true }}">
<div role="menu" aria-label="匯出結果" style="position: absolute; right: 0; bottom: 100%; margin-bottom: 4px; width: 200px; z-index: 2; background: #262626; border-radius: 12px; box-shadow: 0 12px 32px rgba(0,0,0,.5); padding: 6px; display: flex; flex-direction: column">
<sc-for list="{{menu}}" as="m" hint-placeholder-count="7">
<sc-if value="{{m.sep}}" hint-placeholder-val="{{ false }}"><span role="separator" style="height: 1px; background: #333333; margin: 4px 6px"></span></sc-if>
<sc-if value="{{m.item}}" hint-placeholder-val="{{ true }}"><button type="button" role="menuitem" style="height: 34px; padding: 0 10px; border: 0; border-radius: 8px; background: {{m.bg}}; color: #FCFCFC; font-size: 14px; display: flex; align-items: center; gap: 12px; text-align: left; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{m.icon}}"></path></svg><span style="flex: 1">{{m.t}}</span><span style="font-size: 12px; color: #FCFCFC90">{{m.s}}</span></button></sc-if>
</sc-for>
</div>
</sc-if>
</div>

<div role="table" aria-label="退貨率前 8 名" style="flex: none; border: 1px solid #262626; border-radius: 12px; overflow: hidden; display: grid; grid-template-columns: 36px minmax(0, 1.6fr) repeat(2, minmax(0, 1fr)) minmax(0, 1.4fr); font-size: 13px">
<sc-for list="{{head}}" as="h" hint-placeholder-count="5"><span role="columnheader" style="height: 32px; box-sizing: border-box; padding: 0 10px; display: flex; align-items: center; justify-content: {{h.al}}; background: #191919; color: #FCFCFC99; font-size: 12.5px; white-space: nowrap">{{h.t}}</span></sc-for>
<sc-for list="{{cells}}" as="c" hint-placeholder-count="40"><span role="cell" style="height: 32px; box-sizing: border-box; padding: 0 10px; display: flex; align-items: center; justify-content: {{c.al}}; gap: 8px; border-top: 1px solid #262626; color: {{c.fg}}; white-space: nowrap; font-family: {{c.ff}}">{{c.t}}<sc-if value="{{c.bar}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="width: 56px; height: 6px; border-radius: 9px; background: #262626; display: flex; justify-content: flex-end"><span style="width: {{c.w}}; border-radius: 9px; background: #1084FE"></span></span></sc-if></span></sc-for>
</div>

<section aria-label="退貨率長條圖" style="flex: 1; min-height: 0; background: #191919; border-radius: 12px; padding: 10px 14px 8px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12.5px; color: #FCFCFC99">退貨率（%）</span>
<div style="flex: 1; min-height: 0; display: flex; align-items: flex-end; gap: 10px; border-bottom: 1px solid #333333">
<sc-for list="{{bars}}" as="b" hint-placeholder-count="8">
<div style="flex: 1 1 0; min-width: 0; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 3px">
<span style="font-size: 11.5px; color: #FCFCFCcc">{{b.v}}</span>
<span style="width: 70%; height: {{b.h}}; border-radius: 4px 4px 0 0; background: {{b.c}}"></span>
</div>
</sc-for>
</div>
<div style="display: flex; gap: 10px">
<sc-for list="{{bars}}" as="b" hint-placeholder-count="8"><span style="flex: 1 1 0; min-width: 0; text-align: center; font-size: 11px; color: #FCFCFC99; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{b.n}}</span></sc-for>
</div>
</section>


</div>
</aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":960}}'>
