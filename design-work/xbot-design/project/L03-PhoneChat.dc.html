<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const s = (this.state && this.state.d) || '';
return {
open: !s,
closed: !!s,
doneText: s === 'ok' ? '已允許這次 · 小秘繼續比價' : '已退回 · 小秘改用公開頁面',

reject: () => this.setState({ d: 'no' })
};
}
}
