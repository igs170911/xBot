<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<title>建立團隊</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;font-synthesis:none;background:#070707}
h1,h2,h3,strong,b{font-weight:400}
a{color:#7FC0FF;text-decoration:none}a:hover{color:#A9D4FF}
input::placeholder,textarea::placeholder{color:#FCFCFC90}
</style>
</helmet>
<div role="dialog" aria-label="建立團隊" style="width: 760px; min-height: 744px; box-sizing: border-box; background: #111111; border: 1px solid #262626; border-radius: 18px; box-shadow: 0 24px 64px rgba(0,0,0,.6); color: #FCFCFC; font-family: 'Huninn', 'PingFang TC', 'Noto Sans TC', sans-serif; font-size: 15px; line-height: 1.6; display: flex; flex-direction: column; overflow: hidden">
<header style="height: 64px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 12px 0 24px">
<h1 style="margin: 0; font-size: 18px; flex: 1">建立團隊</h1>
<span style="display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; background: rgba(16,132,254,.2); color: #7FC0FF; font-size: 12.5px; white-space: nowrap; flex: none"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z"></path><path d="M20 2v4"></path><path d="M22 4h-4"></path><path d="M2 20a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"></path></svg>簡化：2 步 12 個欄位 → 1 步</span>
<button type="button" aria-label="關閉" style="width: 36px; height: 36px; flex: none; border: 0; border-radius: 10px; background: transparent; color: #FCFCFC99; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>
</header>
<div style="padding: 0 24px; display: flex; flex-direction: column; gap: 14px">
<p style="margin: 0; font-size: 14px; color: #FCFCFC99">挑一個範本，看一下成員，按建立就好。成員都向主管報告，主管向你報告。</p>
<div role="radiogroup" aria-label="範本" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{tpl}}" as="t" hint-placeholder-count="4">
<button type="button" role="radio" aria-checked="{{t.sel}}" onClick="{{t.pick}}" style="display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; box-sizing: border-box; min-height: 132px; border-radius: 16px; background: {{t.bg}}; border: 1px solid {{t.bd}}; box-shadow: {{t.sh}}; color: #FCFCFC; font: inherit; text-align: left; cursor: pointer">
<span style="display: flex; align-items: center; gap: 8px; width: 100%"><span style="font-size: 16px; flex: 1">{{t.name}}</span><span style="font-size: 12.5px; color: #FCFCFC99">{{t.count}}</span></span>
<span style="font-size: 13px; color: #FCFCFC99; line-height: 1.5">{{t.about}}</span>
<span style="display: flex; align-items: center; margin-top: auto; padding-top: 4px">
<sc-for list="{{t.faces}}" as="f" hint-placeholder-count="5">
<span style="margin-right: -4px; display: flex"><dc-import name="Avatar" color="{{f.c}}" body="{{f.b}}" state="idle" dot="none" ring="{{t.bg}}" size="26" hint-size="26px,26px"></dc-import></span>
</sc-for>
<sc-if value="{{t.custom}}" hint-placeholder-val="{{ false }}"><span style="width: 26px; height: 26px; box-sizing: border-box; border-radius: 99px; border: 1.5px dashed #5A5A5A; display: flex; align-items: center; justify-content: center; color: #FCFCFC99"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></span></sc-if>
<span style="font-size: 12.5px; color: #FCFCFC90; margin-left: 12px">{{t.faceNote}}</span>
</span>
</button>
</sc-for>
</div>
<section aria-label="成員預覽" style="background: #191919; border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: baseline; gap: 8px"><h2 style="margin: 0; font-size: 15px; flex: 1">{{previewTitle}}</h2><span style="font-size: 12.5px; color: #FCFCFC90">每個 Bot 都有自己的電腦，第一次收到工作才開機</span></div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px 14px">
<sc-for list="{{preview}}" as="m" hint-placeholder-count="5">
<div style="display: flex; align-items: center; gap: 10px; min-width: 0">
<dc-import name="Avatar" color="{{m.c}}" body="{{m.b}}" state="happy" dot="none" ring="#191919" size="30" hint-size="30px,30px"></dc-import>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.35"><span style="font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{m.n}}</span><span style="font-size: 12.5px; color: #FCFCFC99">{{m.r}}</span></span>
</div>
</sc-for>
</div>
</section>
<div style="display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: #FCFCFCcc"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7FC0FF" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12a10 10 0 1 0 20 0a10 10 0 1 0 -20 0"></path><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg><span>名字、成員、回報時間之後都能改。</span></div>
<a href="F03-TeamBuilder-2.dc.html" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 4px; border-top: 1px solid #262626; color: #FCFCFC"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FCFCFC99" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg><span style="font-size: 14.5px">進階設定</span><span style="font-size: 13px; color: #FCFCFC90">團隊名稱、主管向誰報告、回報時間、團隊群組</span></a>
</div>
<footer style="flex: none; margin-top: auto; display: flex; align-items: center; gap: 8px; padding: 10px 24px 20px">
<span style="flex: 1; font-size: 13px; color: #FCFCFC90">{{totalNote}}</span>
<button type="button" style="height: 36px; padding: 0 16px; box-sizing: border-box; border-radius: 999px; background: #2F2F2F; color: #FCFCFC; border: 0; font: inherit; font-size: 14.5px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; cursor: pointer; text-decoration: none; flex: none">取消</button>
<button type="button" style="height: 36px; padding: 0 18px; border: 0; border-radius: 999px; background: #FCFCFC; color: #070707; font: inherit; font-size: 14.5px; cursor: pointer; white-space: nowrap">{{cta}}</button>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 760, "height": 744}}'>
class Component extends DCLogic {
renderVals() {
const s = this.state || {};
const cur = s.tpl ?? 2;
const P = [['blue', 'cursor'], ['orange', 'blob'], ['green', 'squircle'], ['purple', 'diamond'], ['pink', 'circle'], ['teal', 'drop'], ['yellow', 'hexagon'], ['red', 'shield'], ['cyan', 'star'], ['coral', 'capsule']];
const f = (i) => ({ c: P[i % P.length][0], b: P[i % P.length][1] });
const T = [
{ name: '工程團隊', about: '技術主管帶前端、後端、QA、DBA 與 DevOps，從需求到上線。', lead: '技術主管', members: ['前端工程師', '後端工程師', 'QA 工程師', 'DBA', 'DevOps 工程師'], off: 7 },
{ name: '公司組織', about: '執行長統籌七個職能，每天回報、每週檢討。', lead: '執行長', members: ['營運管理', '市場研究', '業務行銷', '軟體研發', '財務成本', '創意總監', '品質驗收'], off: 0 },
{ name: '行銷團隊', about: '行銷主管帶內容、社群、廣告與數據，一起推新品。', lead: '行銷主管', members: ['內容企劃', '社群經營', '廣告投放', '數據分析'], off: 4 },
{ name: '自訂團隊', about: '從現有的 Bot 挑成員，或從空白開始。', lead: '', members: [], off: 0, custom: true }
];
const tpl = T.map((t, i) => { const on = i === cur; const n = t.custom ? 0 : t.members.length + 1; return {
name: t.name, about: t.about, count: t.custom ? '最多 10 個' : n + ' 個 Bot', custom: !!t.custom,
faces: t.custom ? [] : Array.from({ length: n }, (_, j) => f(j + t.off)),
faceNote: t.custom ? '挑現有的 Bot' : t.lead + '＋' + t.members.length + ' 位',
sel: on ? 'true' : 'false', bg: on ? '#262626' : '#191919', bd: on ? '#1084FE' : '#262626', sh: on ? '0 0 0 1px #1084FE' : 'none',
pick: () => this.setState({ tpl: i }) }; });
const t = T[cur];
const preview = t.custom
? [{ n: '小秘', r: '主管 · 向你報告', c: 'blue', b: 'cursor' }, { n: '抓蟲', r: '向小秘報告', c: 'red', b: 'shield' }, { n: '再挑幾位', r: '在進階設定加成員', c: 'teal', b: 'drop' }]
: [{ n: t.lead, r: '主管 · 向你報告', ...f(t.off) }].concat(t.members.map((m, j) => ({ n: m, r: '向' + t.lead + '報告', ...f(j + 1 + t.off) })));
const n = t.custom ? 0 : t.members.length + 1;
return {
tpl, preview,
previewTitle: t.custom ? '自訂團隊：用現有的 Bot' : '會建立這 ' + n + ' 個 Bot',
cta: t.custom ? '建立團隊' : '建立 ' + n + ' 個 Bot',
totalNote: t.custom ? '不會新增 Bot，只調整報告對象' : '目前 8 個 Bot，建立後共 ' + (8 + n) + ' 個（上限 50）'
};
}
}
</script>
</body>
</html>
