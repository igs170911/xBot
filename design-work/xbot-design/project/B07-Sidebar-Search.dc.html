<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<title>側欄搜尋與精簡側欄</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;font-synthesis:none;background:#070707}
h1,h2,h3{font-weight:400}
a{color:#7FC0FF;text-decoration:none}
</style>
</helmet>
<div style="width: 320px; height: 960px; box-sizing: border-box; padding: 16px 12px; background: #070707; color: #FCFCFC; font-family: 'Huninn', 'PingFang TC', 'Noto Sans TC', sans-serif; font-size: 14.5px; line-height: 1.45; display: flex; flex-direction: column; gap: 8px">

<span style="font-size: 12.5px; color: #FCFCFC90; padding-left: 4px">搜尋中 · ⌘⇧F</span>
<section aria-label="側欄搜尋" style="background: #111111; border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 2px">
<label style="position: relative; display: flex; align-items: center; margin-bottom: 4px">
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">搜尋</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FCFCFC99" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; left: 12px"><path d="{{I.search}}"></path></svg>
<input type="text" value="阿" style="width: 100%; height: 40px; box-sizing: border-box; padding: 0 40px 0 38px; border-radius: 10px; border: 1px solid #459FFE; background: #2F2F2F; color: #FCFCFC; font: inherit; font-size: 14.5px; outline: none; caret-color: #1084FE">
<button type="button" aria-label="清除搜尋" style="position: absolute; right: 4px; width: 32px; height: 32px; border-radius: 8px; border: 0; background: transparent; color: #FCFCFC99; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{I.x}}"></path></svg></button>
</label>

<span style="font-size: 12.5px; color: #FCFCFC90; padding: 6px 8px 2px">Bot</span>
<a href="C01-Chat-Working.dc.html" style="display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 10px; border-radius: 12px; background: #2F2F2F; color: #FCFCFC">
<dc-import name="Avatar" color="orange" body="blob" state="searching" dot="none" ring="#2F2F2F" size="34" hint-size="34px,34px"></dc-import>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<span style="font-size: 15px"><span style="background: rgba(16,132,254,.28); border-radius: 3px">阿</span>哲</span>
<span style="font-size: 13px; color: #FCFCFC99; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">工作中…在蝦皮比價第 3 家</span>
</span>
</a>
<a href="C01-Chat-Working.dc.html" style="display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 10px; border-radius: 12px; color: #FCFCFC">
<dc-import name="Avatar" color="green" body="squircle" state="idle" dot="none" ring="#111111" size="34" hint-size="34px,34px"></dc-import>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<span style="display: flex; align-items: baseline"><span style="font-size: 15px; flex: 1"><span style="background: rgba(16,132,254,.28); border-radius: 3px">阿</span>凱</span><span style="font-size: 12.5px; color: #FCFCFC90">10:42</span></span>
<span style="font-size: 13px; color: #FCFCFC99; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">3 封開發信草稿已完成</span>
</span>
</a>

<span style="font-size: 12.5px; color: #FCFCFC90; padding: 6px 8px 2px">對話串</span>
<a href="C02-Chat-Answer.dc.html" style="display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 10px; border-radius: 12px; color: #FCFCFC">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FCFCFC99" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin: 0 8px"><path d="{{I.messageSquare}}"></path></svg>
<span style="flex: 1; min-width: 0; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis"><span style="background: rgba(16,132,254,.28); border-radius: 3px">阿</span>哲 · 日本賣場比價</span>
<span style="font-size: 12.5px; color: #FCFCFC90">昨天</span>
</a>

<span style="font-size: 12.5px; color: #FCFCFC90; padding: 6px 8px 2px">訊息</span>
<a href="C02-Chat-Answer.dc.html" style="display: flex; align-items: center; gap: 10px; min-height: 50px; padding: 0 10px; border-radius: 12px; color: #FCFCFC">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FCFCFC99" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin: 0 8px"><path d="{{I.messageCircle}}"></path></svg>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<span style="font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">「請<span style="background: rgba(16,132,254,.28); border-radius: 3px">阿</span>哲先抓三家的價格…」</span>
<span style="font-size: 12.5px; color: #FCFCFC90">小秘 · 今天 9:41</span>
</span>
</a>

<button type="button" style="margin-top: 6px; height: 36px; border-radius: 10px; border: 1px solid #333333; background: transparent; color: #FCFCFC99; font: inherit; font-size: 13.5px; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer">在所有訊息和檔案裡找「阿」<kbd style="height: 20px; padding: 0 5px; border-radius: 5px; border: 1px solid #333333; font-family: 'JetBrains Mono', monospace; font-size: 11px; display: flex; align-items: center">⌘K</kbd></button>
</section>

<div style="position: relative; flex: 1; min-height: 0; display: flex; gap: 12px; margin-top: 8px">
<div style="display: flex; flex-direction: column; gap: 8px; flex: none">
<span style="font-size: 12.5px; color: #FCFCFC90; padding-left: 4px; white-space: nowrap">精簡側欄 · ⌘B</span>
<nav aria-label="精簡側欄" style="width: 64px; flex: 1; box-sizing: border-box; background: #111111; border-radius: 14px; padding: 10px 0; display: flex; flex-direction: column; align-items: center; gap: 4px">
<span style="width: 44px; height: 40px; display: flex; align-items: center; justify-content: center"><dc-import name="Mochi" size="26" pose="lazy" hint-size="26px,26px"></dc-import></span>
<sc-for list="{{tools}}" as="t" hint-placeholder-count="3">
<a href="{{t.href}}" aria-label="{{t.label}}" style="position: relative; width: 44px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #FCFCFC99">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg>
<sc-if value="{{t.badge}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; right: 4px; top: 3px; min-width: 16px; height: 16px; box-sizing: border-box; padding: 0 4px; border-radius: 999px; background: #FF9800; color: #1A1100; font-size: 10.5px; display: flex; align-items: center; justify-content: center">5</span></sc-if>
</a>
</sc-for>
<span style="width: 32px; height: 1px; background: #262626; margin: 4px 0"></span>
<sc-for list="{{rail}}" as="b" hint-placeholder-count="6">
<a href="{{b.href}}" aria-label="{{b.label}}" style="width: 48px; height: 48px; border-radius: 12px; background: {{b.bg}}; display: flex; align-items: center; justify-content: center">
<sc-if value="{{b.solo}}" hint-placeholder-val="{{ true }}"><dc-import name="Avatar" color="{{b.color}}" body="{{b.body}}" state="{{b.state}}" dot="{{b.dot}}" ring="{{b.ring}}" size="34" hint-size="34px,34px"></dc-import></sc-if>
<sc-if value="{{b.room}}" hint-placeholder-val="{{ false }}">
<span style="width: 34px; height: 34px; position: relative">
<span style="position: absolute; left: 0; top: 4px"><dc-import name="Avatar" color="blue" body="cursor" state="idle" dot="none" size="22" hint-size="22px,22px"></dc-import></span>
<span style="position: absolute; left: 12px; top: 4px"><dc-import name="Avatar" color="orange" body="blob" state="idle" dot="none" size="22" hint-size="22px,22px"></dc-import></span>
<span style="position: absolute; left: 18px; top: 18px; height: 18px; min-width: 18px; padding: 0 4px; box-sizing: border-box; border-radius: 999px; background: #2F2F2F; color: #FCFCFC99; font-size: 10.5px; display: flex; align-items: center; justify-content: center">+1</span>
</span>
</sc-if>
</a>
</sc-for>
</nav>
</div>

<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 12.5px; color: #FCFCFC90; padding-left: 4px">沒有符合時</span>
<div style="background: #111111; border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 10px">
<span style="height: 36px; border-radius: 10px; background: #2F2F2F; display: flex; align-items: center; padding: 0 12px; font-size: 14px">會計</span>
<span style="font-size: 13.5px; color: #FCFCFC99; padding: 0 2px">沒有叫「會計」的 Bot。</span>
<button type="button" style="height: 32px; border-radius: 999px; border: 0; background: #FCFCFC; color: #070707; font: inherit; font-size: 13.5px; cursor: pointer">建立「會計」Bot</button>
<a href="B03-CommandPalette.dc.html" style="font-size: 13.5px; text-align: center">到所有訊息裡找</a>
</div>

<span style="font-size: 12.5px; color: #FCFCFC90; padding: 4px 4px 0">滑過頭像就看到名字和狀態；表情和小點就是狀態。</span>
</div>
<div style="position: absolute; left: 76px; right: 0; top: 333px; display: flex; align-items: center">
<span aria-hidden="true" style="width: 8px; height: 8px; background: #262626; transform: rotate(45deg); margin-right: -4px; flex: none"></span>
<div role="tooltip" style="flex: 1; min-width: 0; background: #262626; border-radius: 10px; padding: 8px 12px; display: flex; flex-direction: column; box-shadow: 0 12px 32px rgba(0,0,0,.5)">
<span style="font-size: 14px">小編 · 社群小編</span>
<span style="font-size: 12.5px; color: #FFB547">等你回覆：要你輸入驗證碼</span>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":320,"height":960}}'>
class Component extends DCLogic {
renderVals() {
const I = {"inbox": "M22 12L16 12L14 15L10 15L8 12L2 12 M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z", "messageCircle": "M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092 10 10 0 1 0-4.777-4.719", "messageSquare": "M22 17a2 2 0 0 1-2 2H6.828a2 2 0 0 0-1.414.586l-2.202 2.202A.71.71 0 0 1 2 21.286V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2z", "search": "M0 0m21 21-4.34-4.34 M3 11a8 8 0 1 0 16 0a8 8 0 1 0 -16 0", "x": "M18 6 6 18 M0 0m6 6 12 12"};
const B = (label, color, body, state, dot, sel) => ({ label, color, body, state, dot, solo: true, room: false, bg: sel ? '#2F2F2F' : 'transparent', ring: sel ? '#2F2F2F' : '#111111', href: 'C01-Chat-Working.dc.html' });
return {
I,
tools: [
{ label: '搜尋', icon: I.search, badge: false, href: 'B03-CommandPalette.dc.html' },
{ label: '待我處理，5 件', icon: I.inbox, badge: true, href: 'Main.dc.html' }
],
rail: [
B('小秘，工作中', 'blue', 'cursor', 'working', 'none', false),
{ label: '新品上架專案', solo: false, room: true, bg: 'transparent', href: 'D01-Room.dc.html' },
B('阿哲，工作中', 'orange', 'blob', 'searching', 'none', false),
B('小編，等你回覆', 'pink', 'circle', 'notifying', 'waiting', true),
B('阿凱，待命', 'green', 'squircle', 'idle', 'none', false)
]
};
}
}
</script>
</body>
</html>
