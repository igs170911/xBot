<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<title>XBot 登入</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;font-synthesis:none;background:#070707}
h1,h2,h3,h4,p{font-weight:400;margin:0}
button,input,textarea{font-family:inherit}
input::placeholder{color:#FCFCFC90}
a{color:#7FC0FF;text-decoration:none}a:hover{color:#A9D4FF}
@keyframes xspin{to{transform:rotate(360deg)}}
@media (max-width: 640px){nav[aria-label="側欄"],main{min-height:0 !important}}
@keyframes xslide{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
</style>
</helmet>
<div style="min-height: 900px; box-sizing: border-box; padding: 24px 16px; background: #070707; color: #FCFCFC; font-family: 'Huninn', 'PingFang TC', 'Noto Sans TC', sans-serif; font-size: 14.5px; line-height: 1.6; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px">

<main style="width: 100%; max-width: 480px; box-sizing: border-box; padding: 32px; border-radius: 18px; background: #111111; border: 1px solid #262626; display: flex; flex-direction: column; gap: 20px">

<div style="display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">
<dc-import name="Mochi" size="56" pose="wave" hint-size="56px,56px"></dc-import>
<h1 style="font-size: 22px; line-height: 1.3">登入 XBot</h1>
<span style="display: inline-flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px; min-height: 28px; padding: 2px 12px; box-sizing: border-box; border-radius: 999px; background: #191919; font-size: 13px; color: #FCFCFC99"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#38D591" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M5 11h14a2 2 0 0 1 2 2v7a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-7a2 2 0 0 1 2 -2Z"></path><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg><span style="font-family: 'JetBrains Mono', monospace; font-size: 12.5px; color: #FCFCFCcc">xbot.tail3a9c.ts.net</span>· 經 Tailscale 安全連線</span>
</div>

<section aria-label="掃描登入" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 18px; align-items: center; padding: 16px; border-radius: 14px; background: #191919">
<div style="position: relative; flex: none">
<svg width="132" height="132" viewBox="0 0 29 29" role="img" aria-label="QR code" shape-rendering="crispEdges" style="flex: none; display: block; border-radius: 10px"><path d="M0 0h29v29h-29z" fill="#FFFFFF"></path><path d="M2 2h1v1h-1zM3 2h1v1h-1zM4 2h1v1h-1zM5 2h1v1h-1zM6 2h1v1h-1zM7 2h1v1h-1zM8 2h1v1h-1zM11 2h1v1h-1zM13 2h1v1h-1zM15 2h1v1h-1zM20 2h1v1h-1zM21 2h1v1h-1zM22 2h1v1h-1zM23 2h1v1h-1zM24 2h1v1h-1zM25 2h1v1h-1zM26 2h1v1h-1zM2 3h1v1h-1zM8 3h1v1h-1zM11 3h1v1h-1zM12 3h1v1h-1zM14 3h1v1h-1zM15 3h1v1h-1zM16 3h1v1h-1zM18 3h1v1h-1zM20 3h1v1h-1zM26 3h1v1h-1zM2 4h1v1h-1zM4 4h1v1h-1zM5 4h1v1h-1zM6 4h1v1h-1zM8 4h1v1h-1zM10 4h1v1h-1zM12 4h1v1h-1zM14 4h1v1h-1zM18 4h1v1h-1zM20 4h1v1h-1zM22 4h1v1h-1zM23 4h1v1h-1zM24 4h1v1h-1zM26 4h1v1h-1zM2 5h1v1h-1zM4 5h1v1h-1zM5 5h1v1h-1zM6 5h1v1h-1zM8 5h1v1h-1zM10 5h1v1h-1zM12 5h1v1h-1zM13 5h1v1h-1zM17 5h1v1h-1zM20 5h1v1h-1zM22 5h1v1h-1zM23 5h1v1h-1zM24 5h1v1h-1zM26 5h1v1h-1zM2 6h1v1h-1zM4 6h1v1h-1zM5 6h1v1h-1zM6 6h1v1h-1zM8 6h1v1h-1zM10 6h1v1h-1zM11 6h1v1h-1zM15 6h1v1h-1zM17 6h1v1h-1zM20 6h1v1h-1zM22 6h1v1h-1zM23 6h1v1h-1zM24 6h1v1h-1zM26 6h1v1h-1zM2 7h1v1h-1zM8 7h1v1h-1zM10 7h1v1h-1zM14 7h1v1h-1zM15 7h1v1h-1zM20 7h1v1h-1zM26 7h1v1h-1zM2 8h1v1h-1zM3 8h1v1h-1zM4 8h1v1h-1zM5 8h1v1h-1zM6 8h1v1h-1zM7 8h1v1h-1zM8 8h1v1h-1zM10 8h1v1h-1zM12 8h1v1h-1zM14 8h1v1h-1zM16 8h1v1h-1zM18 8h1v1h-1zM20 8h1v1h-1zM21 8h1v1h-1zM22 8h1v1h-1zM23 8h1v1h-1zM24 8h1v1h-1zM25 8h1v1h-1zM26 8h1v1h-1zM10 9h1v1h-1zM11 9h1v1h-1zM13 9h1v1h-1zM15 9h1v1h-1zM16 9h1v1h-1zM18 9h1v1h-1zM7 10h1v1h-1zM8 10h1v1h-1zM9 10h1v1h-1zM10 10h1v1h-1zM11 10h1v1h-1zM13 10h1v1h-1zM14 10h1v1h-1zM16 10h1v1h-1zM17 10h1v1h-1zM19 10h1v1h-1zM20 10h1v1h-1zM23 10h1v1h-1zM24 10h1v1h-1zM4 11h1v1h-1zM5 11h1v1h-1zM6 11h1v1h-1zM10 11h1v1h-1zM11 11h1v1h-1zM12 11h1v1h-1zM14 11h1v1h-1zM15 11h1v1h-1zM17 11h1v1h-1zM18 11h1v1h-1zM19 11h1v1h-1zM20 11h1v1h-1zM22 11h1v1h-1zM23 11h1v1h-1zM3 12h1v1h-1zM5 12h1v1h-1zM7 12h1v1h-1zM8 12h1v1h-1zM11 12h1v1h-1zM13 12h1v1h-1zM16 12h1v1h-1zM17 12h1v1h-1zM18 12h1v1h-1zM21 12h1v1h-1zM22 12h1v1h-1zM26 12h1v1h-1zM2 13h1v1h-1zM5 13h1v1h-1zM6 13h1v1h-1zM7 13h1v1h-1zM11 13h1v1h-1zM13 13h1v1h-1zM14 13h1v1h-1zM15 13h1v1h-1zM17 13h1v1h-1zM19 13h1v1h-1zM20 13h1v1h-1zM21 13h1v1h-1zM23 13h1v1h-1zM24 13h1v1h-1zM2 14h1v1h-1zM8 14h1v1h-1zM9 14h1v1h-1zM10 14h1v1h-1zM12 14h1v1h-1zM14 14h1v1h-1zM15 14h1v1h-1zM16 14h1v1h-1zM18 14h1v1h-1zM21 14h1v1h-1zM2 15h1v1h-1zM3 15h1v1h-1zM7 15h1v1h-1zM10 15h1v1h-1zM12 15h1v1h-1zM16 15h1v1h-1zM18 15h1v1h-1zM20 15h1v1h-1zM21 15h1v1h-1zM22 15h1v1h-1zM23 15h1v1h-1zM25 15h1v1h-1zM26 15h1v1h-1zM4 16h1v1h-1zM6 16h1v1h-1zM8 16h1v1h-1zM11 16h1v1h-1zM14 16h1v1h-1zM15 16h1v1h-1zM16 16h1v1h-1zM17 16h1v1h-1zM19 16h1v1h-1zM20 16h1v1h-1zM21 16h1v1h-1zM22 16h1v1h-1zM4 17h1v1h-1zM7 17h1v1h-1zM12 17h1v1h-1zM16 17h1v1h-1zM18 17h1v1h-1zM20 17h1v1h-1zM21 17h1v1h-1zM22 17h1v1h-1zM24 17h1v1h-1zM25 17h1v1h-1zM26 17h1v1h-1zM3 18h1v1h-1zM5 18h1v1h-1zM8 18h1v1h-1zM9 18h1v1h-1zM10 18h1v1h-1zM11 18h1v1h-1zM13 18h1v1h-1zM16 18h1v1h-1zM17 18h1v1h-1zM18 18h1v1h-1zM19 18h1v1h-1zM20 18h1v1h-1zM21 18h1v1h-1zM22 18h1v1h-1zM24 18h1v1h-1zM11 19h1v1h-1zM12 19h1v1h-1zM13 19h1v1h-1zM14 19h1v1h-1zM16 19h1v1h-1zM17 19h1v1h-1zM18 19h1v1h-1zM22 19h1v1h-1zM24 19h1v1h-1zM2 20h1v1h-1zM3 20h1v1h-1zM4 20h1v1h-1zM5 20h1v1h-1zM6 20h1v1h-1zM7 20h1v1h-1zM8 20h1v1h-1zM11 20h1v1h-1zM14 20h1v1h-1zM17 20h1v1h-1zM18 20h1v1h-1zM20 20h1v1h-1zM22 20h1v1h-1zM24 20h1v1h-1zM25 20h1v1h-1zM26 20h1v1h-1zM2 21h1v1h-1zM8 21h1v1h-1zM11 21h1v1h-1zM12 21h1v1h-1zM13 21h1v1h-1zM15 21h1v1h-1zM18 21h1v1h-1zM22 21h1v1h-1zM25 21h1v1h-1zM2 22h1v1h-1zM4 22h1v1h-1zM5 22h1v1h-1zM6 22h1v1h-1zM8 22h1v1h-1zM14 22h1v1h-1zM15 22h1v1h-1zM16 22h1v1h-1zM18 22h1v1h-1zM19 22h1v1h-1zM20 22h1v1h-1zM21 22h1v1h-1zM22 22h1v1h-1zM25 22h1v1h-1zM2 23h1v1h-1zM4 23h1v1h-1zM5 23h1v1h-1zM6 23h1v1h-1zM8 23h1v1h-1zM10 23h1v1h-1zM12 23h1v1h-1zM17 23h1v1h-1zM22 23h1v1h-1zM25 23h1v1h-1zM2 24h1v1h-1zM4 24h1v1h-1zM5 24h1v1h-1zM6 24h1v1h-1zM8 24h1v1h-1zM12 24h1v1h-1zM13 24h1v1h-1zM15 24h1v1h-1zM17 24h1v1h-1zM19 24h1v1h-1zM23 24h1v1h-1zM25 24h1v1h-1zM2 25h1v1h-1zM8 25h1v1h-1zM10 25h1v1h-1zM11 25h1v1h-1zM12 25h1v1h-1zM13 25h1v1h-1zM19 25h1v1h-1zM20 25h1v1h-1zM21 25h1v1h-1zM26 25h1v1h-1zM2 26h1v1h-1zM3 26h1v1h-1zM4 26h1v1h-1zM5 26h1v1h-1zM6 26h1v1h-1zM7 26h1v1h-1zM8 26h1v1h-1zM10 26h1v1h-1zM12 26h1v1h-1zM13 26h1v1h-1zM14 26h1v1h-1zM16 26h1v1h-1zM17 26h1v1h-1zM18 26h1v1h-1zM19 26h1v1h-1zM20 26h1v1h-1zM21 26h1v1h-1zM25 26h1v1h-1zM26 26h1v1h-1z" fill="#070707"></path></svg>
<sc-if value="{{scanned}}" hint-placeholder-val="{{ false }}">
<span style="position: absolute; inset: 0; border-radius: 10px; background: rgba(7,7,7,.82); display: flex; align-items: center; justify-content: center"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#38D591" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M21.801 10A10 10 0 1 1 17 3.335"></path><path d="m9 11 3 3L22 4"></path></svg></span>
</sc-if>
</div>
<div style="flex: 1 1 180px; min-width: 0; display: flex; flex-direction: column; gap: 8px">
<h2 style="font-size: 16px; line-height: 1.4">用已登入的手機掃一下</h2>
<ol style="margin: 0; padding-left: 18px; font-size: 13.5px; color: #FCFCFC99; line-height: 1.65">
<li>在手機的 XBot 點右上角掃描</li>
<li>對準這個 QR，按「允許登入」</li>
</ol>
<sc-if value="{{waiting}}" hint-placeholder-val="{{ true }}">
<button type="button" onClick="{{scan}}" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; border: 0; padding: 0; background: transparent; font-size: 12.5px; color: #FCFCFC90; cursor: pointer"><span style="display: flex; animation: xspin 1.2s linear infinite"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#7FC0FF" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg></span>等你掃描 · 5 分鐘內有效</button>
</sc-if>
<sc-if value="{{scanned}}" hint-placeholder-val="{{ false }}">
<span style="display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: #38D591"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#38D591" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M20 6 9 17l-5-5"></path></svg>已允許，正在登入…</span>
</sc-if>
</div>
</section>

<div style="display: flex; align-items: center; gap: 12px; font-size: 12.5px; color: #FCFCFC90"><span style="flex: 1; height: 1px; background: #333333"></span>或輸入登入碼<span style="flex: 1; height: 1px; background: #333333"></span></div>

<form style="display: flex; flex-direction: column; gap: 8px; margin: 0" onSubmit="{{submit}}">
<label for="code" style="font-size: 13px; color: #FCFCFC99">登入碼（主機上的 設定 › 電腦與裝置 › 加入裝置）</label>
<div style="display: flex; gap: 8px">
<input id="code" type="text" value="{{code}}" onInput="{{type}}" placeholder="12 碼，例如 K7QF-2M9X-HD4P" autocomplete="one-time-code" style="flex: 1; min-width: 0; height: 40px; box-sizing: border-box; padding: 0 12px; border-radius: 10px; background: #191919; border: 1px solid {{codeBorder}}; color: #FCFCFC; font-size: 14.5px; letter-spacing: 0.04em; outline: 0">
<button type="submit" style="height: 40px; padding: 0 18px; border: 0; border-radius: 999px; background: #FCFCFC; color: #070707; font-size: 14.5px; cursor: pointer">登入</button>
</div>
<sc-if value="{{err}}" hint-placeholder-val="{{ false }}">
<span role="alert" style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #FF5667"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FF5667" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M2 12a10 10 0 1 0 20 0a10 10 0 1 0 -20 0"></path><path d="M12 8L12 12"></path><path d="M12 16L12.01 16"></path></svg>登入碼不對，再確認一次（還可以試 9 次）</span>
</sc-if>
<span style="font-size: 12.5px; color: #FCFCFC90">登入後這台裝置會記住 30 天。</span>
</form>

<div style="border-top: 1px solid #262626; margin: 0 -32px -12px; padding: 4px 20px 0">
<button type="button" aria-expanded="{{lanOpen}}" onClick="{{toggleLan}}" style="width: 100%; min-height: 44px; display: flex; align-items: center; gap: 10px; border: 0; padding: 0 12px; border-radius: 10px; background: transparent; color: #FCFCFC99; font-size: 13.5px; cursor: pointer; text-align: left"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M12 20h.01"></path><path d="M2 8.82a15 15 0 0 1 20 0"></path><path d="M5 12.859a10 10 0 0 1 14 0"></path><path d="M8.5 16.429a5 5 0 0 1 7 0"></path></svg><span style="flex: 1">沒有 Tailscale？改用區網（兩步）</span><span style="display: flex; transform: rotate({{lanRot}}deg)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="m9 18 6-6-6-6"></path></svg></span></button>
<sc-if value="{{lanOpen}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; gap: 12px; padding: 4px 12px 8px">
<div style="flex: 1 1 0; min-width: 0; display: flex; gap: 10px; align-items: flex-start; padding: 12px; border-radius: 12px; background: #191919">
<span style="width: 22px; height: 22px; flex: none; border-radius: 6px; background: #333333; color: #FCFCFC99; font-size: 12px; display: flex; align-items: center; justify-content: center">1</span>
<span style="font-size: 13px; color: #FCFCFC99; line-height: 1.55"><span style="color: #FCFCFC">安裝 XBot 憑證</span><br>每台裝置裝一次</span>
</div>
<div style="flex: 1 1 0; min-width: 0; display: flex; gap: 10px; align-items: flex-start; padding: 12px; border-radius: 12px; background: #191919">
<span style="width: 22px; height: 22px; flex: none; border-radius: 6px; background: #333333; color: #FCFCFC99; font-size: 12px; display: flex; align-items: center; justify-content: center">2</span>
<span style="font-size: 13px; color: #FCFCFC99; line-height: 1.55"><span style="color: #FCFCFC">打開主機網址</span><br><span style="font-family: 'JetBrains Mono', monospace; font-size: 12px">https://192.168.1.20:8791</span></span>
</div>
</div>
</sc-if>
</div>
</main>

<section aria-label="可能出現的錯誤" style="width: 100%; max-width: 760px; display: flex; flex-direction: column; align-items: center; gap: 8px">
<span style="font-size: 12.5px; color: #FCFCFC90">其他狀態</span>
<div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 8px">
<span style="display: inline-flex; align-items: center; gap: 8px; min-height: 34px; padding: 0 14px; border-radius: 999px; background: #111111; border: 1px solid #262626; font-size: 13px; color: #FCFCFCcc"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFB547" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M10 2L14 2"></path><path d="M12 14L15 11"></path><path d="M4 14a8 8 0 1 0 16 0a8 8 0 1 0 -16 0"></path></svg>QR 過期了，已換一張新的</span>
<span style="display: inline-flex; align-items: center; gap: 8px; min-height: 34px; padding: 0 14px; border-radius: 999px; background: #111111; border: 1px solid #262626; font-size: 13px; color: #FCFCFCcc"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FF5667" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M5 11h14a2 2 0 0 1 2 2v7a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-7a2 2 0 0 1 2 -2Z"></path><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>試太多次了，60 秒後再試</span>
<span style="display: inline-flex; align-items: center; gap: 8px; min-height: 34px; padding: 0 14px; border-radius: 999px; background: #111111; border: 1px solid #262626; font-size: 13px; color: #FCFCFCcc"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FF5667" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M12 20h.01"></path><path d="M8.5 16.429a5 5 0 0 1 7 0"></path><path d="M5 12.859a10 10 0 0 1 5.17-2.69"></path><path d="M19 12.859a10 10 0 0 0-2.007-1.523"></path><path d="M2 8.82a15 15 0 0 1 4.177-2.643"></path><path d="M22 8.82a15 15 0 0 0-11.288-3.764"></path><path d="m2 2 20 20"></path></svg>連不到主機：確認這台裝置已開 Tailscale</span>
</div>
</section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { code: '', err: false, lanOpen: false, scanned: false };
}
renderVals() {
const s = this.state;
return {
code: s.code,
err: s.err,
lanOpen: s.lanOpen,
lanRot: s.lanOpen ? 90 : 0,
scanned: s.scanned,
waiting: !s.scanned,
codeBorder: s.err ? '#FF5667' : '#333333',
type: (e) => this.setState({ code: e.target.value, err: false }),
submit: (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ err: true }); },
toggleLan: () => this.setState({ lanOpen: !s.lanOpen }),
scan: () => this.setState({ scanned: true })
};
}
}
</script>
</body>
</html>
