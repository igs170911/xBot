<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<title>首次設定 2/2 認識小秘</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;font-synthesis:none;background:#070707}
h1,h2,h3,h4,p{font-weight:400;margin:0}
button,input,textarea{font-family:inherit}
input::placeholder{color:#FCFCFC90}
a{color:#7FC0FF;text-decoration:none}a:hover{color:#A9D4FF}
@keyframes xspin{to{transform:rotate(360deg)}}
@media (max-width: 640px){nav[aria-label="側欄"],main{min-height:0 !important}}
@keyframes xslide{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
</style>
</helmet>
<div style="min-height: 900px; box-sizing: border-box; padding: 16px 16px 24px; background: #070707; color: #FCFCFC; font-family: 'Huninn', 'PingFang TC', 'Noto Sans TC', sans-serif; font-size: 14.5px; line-height: 1.6; display: flex; flex-direction: column; align-items: center; gap: 8px">

<div style="width: 100%; display: flex; align-items: center; flex-wrap: wrap; gap: 8px; min-height: 40px; padding: 0 8px; box-sizing: border-box">
<dc-import name="Mochi" size="24" pose="lazy" hint-size="24px,24px"></dc-import>
<span style="font-size: 16px; flex: 1">XBot</span>
<span style="display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; background: rgba(16,132,254,.2); color: #7FC0FF; font-size: 12.5px; white-space: nowrap"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#7FC0FF" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z"></path><path d="M20 2v4"></path><path d="M22 4h-4"></path><path d="M2 20a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"></path></svg>簡化：6 步 → 2 步</span>
</div>

<main style="flex: 1; width: 100%; display: flex; align-items: center; justify-content: center">
<div style="width: 100%; max-width: 520px; box-sizing: border-box; padding: 28px 32px; border-radius: 18px; background: #111111; border: 1px solid #262626; display: flex; flex-direction: column; gap: 16px">

<div style="display: flex; align-items: center; gap: 10px">
<a href="A03-Onboard-Hello.dc.html" aria-label="回上一步" style="width: 30px; height: 30px; margin-left: -6px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #FCFCFC99"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg></a>
<span style="font-size: 13px; color: #FCFCFC90">步驟 2 / 2</span>
<span style="display: flex; gap: 4px"><span style="width: 28px; height: 4px; border-radius: 4px; background: #FCFCFC"></span><span style="width: 28px; height: 4px; border-radius: 4px; background: #FCFCFC"></span></span>
</div>

<div style="display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center">
<dc-import name="Avatar" color="{{color}}" body="{{body}}" state="happy" dot="none" ring="#111111" size="96" hint-size="96px,96px"></dc-import>
<h1 style="font-size: 24px; line-height: 1.3">認識{{name}}</h1>
<p style="font-size: 14.5px; color: #FCFCFC99; max-width: 400px">{{name}}是你的幕僚長。你交代事情給它，它會自己做，或分給之後加入的 Bot。</p>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="bname" style="font-size: 13px; color: #FCFCFC99">名字</label>
<input id="bname" type="text" value="{{name}}" onInput="{{typeName}}" style="height: 40px; box-sizing: border-box; padding: 0 12px; border-radius: 10px; background: #191919; border: 1px solid #333333; color: #FCFCFC; font-size: 14.5px; outline: 0">
</div>

<div style="display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; background: #191919">
<span style="display: flex; padding-top: 2px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#38D591" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"></path><path d="m9 12 2 2 4-4"></path></svg></span>
<span style="flex: 1; display: flex; flex-direction: column">
<span style="font-size: 14.5px">先問我</span>
<span style="font-size: 13px; color: #FCFCFC99; line-height: 1.55">付款、對外發送、刪除這類事，做之前先問你。</span>
</span>
<span style="font-size: 12.5px; color: #FCFCFC90; white-space: nowrap; padding-top: 2px">之後可改</span>
</div>

<div style="border-radius: 12px; border: 1px solid #262626">
<button type="button" aria-expanded="{{lookOpen}}" onClick="{{toggleLook}}" style="width: 100%; min-height: 44px; display: flex; align-items: center; gap: 10px; border: 0; padding: 0 14px; background: transparent; color: #FCFCFC99; font-size: 13.5px; cursor: pointer; text-align: left"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M12 22a1 1 0 0 1 0-20 10 9 0 0 1 10 9 5 5 0 0 1-5 5h-2.25a1.75 1.75 0 0 0-1.4 2.8l.3.4a1.75 1.75 0 0 1-1.4 2.8z"></path><path d="M13 6.5a0.5 0.5 0 1 0 1 0a0.5 0.5 0 1 0 -1 0"></path><path d="M17 10.5a0.5 0.5 0 1 0 1 0a0.5 0.5 0 1 0 -1 0"></path><path d="M6 12.5a0.5 0.5 0 1 0 1 0a0.5 0.5 0 1 0 -1 0"></path><path d="M8 7.5a0.5 0.5 0 1 0 1 0a0.5 0.5 0 1 0 -1 0"></path></svg><span style="flex: 1">換個樣子</span><span style="display: flex; transform: rotate({{lookRot}}deg)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="m9 18 6-6-6-6"></path></svg></span></button>
<sc-if value="{{lookOpen}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 10px; padding: 0 14px 14px">
<span style="font-size: 12.5px; color: #FCFCFC90">顏色</span>
<div role="radiogroup" aria-label="顏色" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{colors}}" as="c" hint-placeholder-count="10">
<button type="button" role="radio" aria-checked="{{c.on}}" aria-label="{{c.label}}" onClick="{{c.pick}}" style="width: 30px; height: 30px; border-radius: 999px; border: 2px solid {{c.ring}}; padding: 3px; background: transparent; cursor: pointer; box-sizing: border-box"><span style="display: block; width: 100%; height: 100%; border-radius: 999px; background: {{c.hex}}"></span></button>
</sc-for>
</div>
<span style="font-size: 12.5px; color: #FCFCFC90">造型</span>
<div role="radiogroup" aria-label="造型" style="display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px">
<sc-for list="{{bodies}}" as="b" hint-placeholder-count="10">
<button type="button" role="radio" aria-checked="{{b.on}}" aria-label="{{b.label}}" onClick="{{b.pick}}" style="height: 40px; border-radius: 10px; border: 0; background: {{b.bg}}; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0"><dc-import name="Avatar" color="{{color}}" body="{{b.key}}" state="idle" dot="none" ring="{{b.bg}}" size="28" hint-size="28px,28px"></dc-import></button>
</sc-for>
</div>
</div>
</sc-if>
</div>

<a href="A05-Onboard-Import.dc.html" style="height: 48px; border-radius: 999px; background: #FCFCFC; color: #070707; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 8px">開始<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#070707" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></a>
<span style="font-size: 12.5px; color: #FCFCFC90; text-align: center; margin-top: -4px">名字、樣子、權限之後都能在{{name}}的設定裡改。</span>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { name: '小秘', color: 'blue', body: 'cursor', lookOpen: false };
}
renderVals() {
const s = this.state;
const HEX = { green: '#009957', blue: '#377FE6', red: '#D94B52', orange: '#E78531', purple: '#8057C8', cyan: '#0EA5C6', pink: '#D84F8B', yellow: '#D8A729', teal: '#01A492', coral: '#E5634E' };
const CN = { green: '綠', blue: '藍', red: '紅', orange: '橘', purple: '紫', cyan: '青', pink: '粉紅', yellow: '黃', teal: '藍綠', coral: '珊瑚' };
const BODIES = [['cursor', '游標'], ['blob', '圓團'], ['circle', '圓'], ['squircle', '方圓'], ['capsule', '膠囊'], ['drop', '水滴'], ['shield', '盾'], ['hexagon', '六角'], ['diamond', '菱形'], ['star', '星']];
return {
name: s.name || '小秘',
color: s.color,
body: s.body,
lookOpen: s.lookOpen,
lookRot: s.lookOpen ? 90 : 0,
toggleLook: () => this.setState({ lookOpen: !s.lookOpen }),
typeName: (e) => this.setState({ name: e.target.value }),
colors: Object.keys(HEX).map((k) => ({ hex: HEX[k], label: CN[k], on: k === s.color, ring: k === s.color ? '#FCFCFC' : 'transparent', pick: () => this.setState({ color: k }) })),
bodies: BODIES.map(([k, label]) => ({ key: k, label, on: k === s.body, bg: k === s.body ? '#2F2F2F' : 'transparent', pick: () => this.setState({ body: k }) }))
};
}
}
</script>
</body>
</html>
