<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<title>對話：空狀態與對話串</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;font-synthesis:none;background:#070707}
input::placeholder{color:#FCFCFC90}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="min-height: 960px; display: flex; flex-wrap: wrap; background: #070707; color: #FCFCFC; font-family: 'Huninn', 'PingFang TC', 'Noto Sans TC', sans-serif; font-size: 14.5px; line-height: 1.6; position: relative">

<div style="flex: 1 1 300px; max-width: 300px; background: #111111">
<dc-import name="Sidebar" active="none" theme="dark" hint-size="100%,960px"></dc-import>
</div>

<main style="flex: 999 1 560px; min-width: 0; height: 960px; display: flex; flex-direction: column; background: #070707; position: relative">

<header style="height: 56px; flex: none; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 20px">
<dc-import name="Avatar" color="red" body="shield" state="idle" dot="none" ring="#070707" size="26" hint-size="26px,26px"></dc-import>
<span style="font-size: 16px">抓蟲</span>
<span style="font-size: 13px; color: #FCFCFC90">待命</span>
<span style="width: 1px; height: 20px; background: #333333; margin: 0 4px"></span>
<button type="button" aria-haspopup="menu" aria-expanded="{{menu}}" onClick="{{toggleMenu}}" style="height: 32px; padding: 0 8px 0 12px; border: 1px solid {{pillBorder}}; border-radius: 999px; background: {{pillBg}}; color: #FCFCFC; font-size: 13.5px; display: flex; align-items: center; gap: 6px; white-space: nowrap"><span style="display: flex; color: #FCFCFC99"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M22 17a2 2 0 0 1-2 2H6.828a2 2 0 0 0-1.414.586l-2.202 2.202A.71.71 0 0 1 2 21.286V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2z"></path></svg></span>{{threadName}}<span style="font-size: 12px; color: #FCFCFC90">1</span><span style="display: flex; color: #FCFCFC99"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="m6 9 6 6 6-6"></path></svg></span></button>
<span style="flex: 1"></span>

<button type="button" aria-haspopup="listbox" style="height: 32px; padding: 0 10px 0 14px; border: 0; border-radius: 999px; background: #262626; color: #FCFCFC; font-size: 13.5px; display: flex; align-items: center; gap: 6px; white-space: nowrap">Claude Sonnet 5.5<span style="display: flex; color: #FCFCFC99"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="m6 9 6 6 6-6"></path></svg></span></button>
<button type="button" aria-label="語音通話" style="width: 36px; height: 36px; border: 0; border-radius: 10px; background: transparent; color: #FCFCFC99; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M13.832 16.568a1 1 0 0 0 1.213-.303l.355-.465A2 2 0 0 1 17 15h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2A18 18 0 0 1 2 4a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v3a2 2 0 0 1-.8 1.6l-.468.351a1 1 0 0 0-.292 1.233 14 14 0 0 0 6.392 6.384"></path></svg></button>
<button type="button" aria-label="抓蟲的電腦" style="width: 36px; height: 36px; border: 0; border-radius: 10px; background: transparent; color: #FCFCFC99; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M4 3h16a2 2 0 0 1 2 2v10a2 2 0 0 1 -2 2h-16a2 2 0 0 1 -2 -2v-10a2 2 0 0 1 2 -2Z"></path><path d="M8 21L16 21"></path><path d="M12 17L12 21"></path></svg></button>
<button type="button" aria-label="更多" style="width: 36px; height: 36px; border: 0; border-radius: 10px; background: transparent; color: #FCFCFC99; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M11 12a1 1 0 1 0 2 0a1 1 0 1 0 -2 0"></path><path d="M18 12a1 1 0 1 0 2 0a1 1 0 1 0 -2 0"></path><path d="M4 12a1 1 0 1 0 2 0a1 1 0 1 0 -2 0"></path></svg></button>
</header>

<sc-if value="{{menu}}" hint-placeholder-val="{{ true }}">
<div role="menu" aria-label="對話串" style="position: absolute; top: 48px; left: 145px; z-index: 5; width: 236px; background: #262626; border-radius: 12px; padding: 6px; box-shadow: 0 12px 32px rgba(0,0,0,.5); display: flex; flex-direction: column">
<span style="font-size: 12px; color: #FCFCFC90; padding: 6px 10px 4px">抓蟲的對話串</span>
<button type="button" role="menuitemradio" aria-checked="true" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 10px; border: 0; border-radius: 8px; background: #2F2F2F; color: #FCFCFC; font-size: 14px; text-align: left">
<span style="display: flex; color: #FCFCFC99"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M22 17a2 2 0 0 1-2 2H6.828a2 2 0 0 0-1.414.586l-2.202 2.202A.71.71 0 0 1 2 21.286V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2z"></path></svg></span>
<span style="flex: 1; display: flex; flex-direction: column; line-height: 1.3"><span>{{threadName}}</span><span style="font-size: 12px; color: #FCFCFC90">剛剛 · 還沒有訊息</span></span>
<span style="display: flex; color: #1084FE"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M20 6 9 17l-5-5"></path></svg></span>
</button>
<span style="height: 1px; background: #333333; margin: 6px 6px"></span>
<button type="button" role="menuitem" style="display: flex; align-items: center; gap: 12px; height: 34px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; color: #FCFCFC; font-size: 14px; text-align: left"><span style="display: flex; color: #FCFCFC99"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></span><span style="flex: 1">新對話串</span><span style="font-size: 12.5px; color: #FCFCFC90">⌘N</span></button>
<button type="button" role="menuitem" onClick="{{openRename}}" style="display: flex; align-items: center; gap: 12px; height: 34px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; color: #FCFCFC; font-size: 14px; text-align: left"><span style="display: flex; color: #FCFCFC99"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span>重新命名</button>
<button type="button" role="menuitem" style="display: flex; align-items: center; gap: 12px; height: 34px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; color: #FCFCFC; font-size: 14px; text-align: left"><span style="display: flex; color: #FCFCFC99"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M12 17v5"></path><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"></path></svg></span>釘選到側欄</button>
<span style="height: 1px; background: #333333; margin: 6px 6px"></span>
<button type="button" role="menuitem" style="display: flex; align-items: center; gap: 12px; height: 34px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; color: #FF5667; font-size: 14px; text-align: left"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"></path><path d="M3 6h18"></path><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>刪除對話串</button>
</div>
</sc-if>

<div style="flex: 1; min-height: 0; overflow-y: auto">
<div style="max-width: 828px; min-height: 100%; margin: 0 auto; box-sizing: border-box; padding: 16px 24px; display: flex; flex-direction: column; justify-content: center; gap: 16px">

<div style="display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; padding-bottom: 12px">
<dc-import name="Avatar" color="red" body="shield" state="happy" dot="none" ring="#070707" size="72" hint-size="72px,72px"></dc-import>
<h1 style="margin: 6px 0 0; font-size: 24px; font-weight: 400">抓蟲</h1>
<span style="font-size: 14px; color: #FCFCFC99">Bug 重現 · 照你的描述重做一次，錄下步驟和截圖</span>
<span style="display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 6px; font-size: 12.5px; color: #FCFCFC99">
<span style="display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border: 1px solid #333333; border-radius: 999px"><span style="display: flex"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"></path><path d="m9 12 2 2 4-4"></path></svg></span>先問我</span>
<span style="display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border: 1px solid #333333; border-radius: 999px"><span style="display: flex"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M4 3h16a2 2 0 0 1 2 2v10a2 2 0 0 1 -2 2h-16a2 2 0 0 1 -2 -2v-10a2 2 0 0 1 2 -2Z"></path><path d="M8 21L16 21"></path><path d="M12 17L12 21"></path></svg></span>地端電腦 · 第一次交辦時開機</span>
<span style="display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border: 1px solid #333333; border-radius: 999px"><span style="display: flex"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z"></path><path d="M20 2v4"></path><path d="M22 4h-4"></path><path d="M2 20a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"></path></svg></span>3 個技能</span>
</span>
</div>

<span style="align-self: center; font-size: 12.5px; color: #FCFCFC90">今天 下午 3:10</span>
<div style="align-self: flex-start; max-width: 85%; background: #262626; border-radius: 20px; padding: 10px 16px">嗨，我是抓蟲。給我網址和問題，我會在我的電腦上重做一次，把步驟和截圖整理給你。</div>

<section aria-labelledby="c03q" style="background: #262626; border-radius: 18px; padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: flex-start; gap: 12px">
<div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
<h2 id="c03q" style="margin: 0; font-size: 16px; font-weight: 400">你最常要我重現哪一類問題？</h2>
<span style="font-size: 13px; color: #FCFCFC99">選最接近的就好，之後都能改。</span>
</div>
<button type="button" aria-label="略過這題" style="width: 30px; height: 30px; border: 0; border-radius: 8px; background: transparent; color: #FCFCFC99; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>
</div>
<div style="border: 1px solid #333333; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column">
<sc-for list="{{opts}}" as="o" hint-placeholder-count="4">
<button type="button" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 14px; border: 0; border-top: {{o.line}}; background: transparent; color: #FCFCFC; font-size: 15px; text-align: left"><span style="width: 20px; height: 20px; flex: none; border-radius: 5px; background: #333333; color: #FCFCFC99; font-size: 12px; display: flex; align-items: center; justify-content: center">{{o.k}}</span>{{o.t}}</button>
</sc-for>
</div>
<label style="display: flex"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">輸入你自己的答案</span><input type="text" placeholder="輸入你自己的答案" style="flex: 1; height: 44px; box-sizing: border-box; border: 0; border-radius: 10px; background: #191919; color: #FCFCFC; font: inherit; font-size: 14.5px; padding: 0 14px; outline: none"></label>
</section>

</div>
</div>

<div style="flex: none; padding: 8px 24px 20px">
<div style="max-width: 780px; margin: 0 auto">
<div style="height: 52px; box-sizing: border-box; border-radius: 999px; background: #2F2F2F; display: flex; align-items: center; gap: 2px; padding: 0 10px 0 8px">
<button type="button" aria-label="加入檔案或更多" style="width: 36px; height: 36px; border: 0; border-radius: 999px; background: transparent; color: #FCFCFC99; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></button>
<label style="flex: 1; min-width: 0; display: flex"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">交代抓蟲</span><input type="text" placeholder="交代抓蟲…" style="flex: 1; min-width: 0; height: 36px; border: 0; background: transparent; color: #FCFCFC; font: inherit; font-size: 15px; outline: none; padding: 0 6px"></label>
<button type="button" aria-label="語音輸入" style="width: 36px; height: 36px; border: 0; border-radius: 999px; background: transparent; color: #FCFCFC99; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M12 19v3"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><path d="M12 2h0a3 3 0 0 1 3 3v7a3 3 0 0 1 -3 3h0a3 3 0 0 1 -3 -3v-7a3 3 0 0 1 3 -3Z"></path></svg></button>
</div>
</div>
</div>
</main>

<sc-if value="{{rename}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; z-index: 10; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; padding: 16px">
<div role="dialog" aria-modal="true" aria-labelledby="c03r" style="width: 440px; max-width: 100%; box-sizing: border-box; background: #111111; border: 1px solid #262626; border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 12px 32px rgba(0,0,0,.5)">
<div style="display: flex; align-items: center; gap: 12px">
<h2 id="c03r" style="flex: 1; margin: 0; font-size: 17px; font-weight: 400">重新命名對話串</h2>
<button type="button" aria-label="關閉" onClick="{{close}}" style="width: 36px; height: 36px; border: 0; border-radius: 10px; background: transparent; color: #FCFCFC99; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>
</div>
<label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; color: #FCFCFC99">名稱</span><input type="text" value="結帳按鈕沒反應" style="height: 40px; box-sizing: border-box; border: 1px solid #459FFE; border-radius: 10px; background: #191919; color: #FCFCFC; font: inherit; font-size: 14.5px; padding: 0 12px; outline: none"></label>
<span style="font-size: 12.5px; color: #FCFCFC90">不改的話，會用第一則訊息自動命名。</span>
<div style="display: flex; justify-content: flex-end; gap: 8px">
<button type="button" onClick="{{close}}" style="height: 36px; padding: 0 16px; border: 0; border-radius: 999px; background: #2F2F2F; color: #FCFCFC; font-size: 14px">取消</button>
<button type="button" onClick="{{close}}" style="height: 36px; padding: 0 16px; border: 0; border-radius: 999px; background: #FCFCFC; color: #070707; font-size: 14px">儲存</button>
</div>
</div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"overlay":{"editor":"enum","default":"menu","options":["menu","rename","none"]},"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
renderVals() {
const ov = (this.state && this.state.ov) || this.props.overlay || 'menu';
const opts = [['A', '網站或網頁上的問題'], ['B', '蝦皮賣場與賣家後台'], ['C', '手機版網頁'], ['D', '都有一點']];
return {
menu: ov === 'menu',
rename: ov === 'rename',
threadName: '主要對話',
pillBg: ov === 'menu' ? '#262626' : 'transparent',
pillBorder: ov === 'menu' ? '#3D3D3D' : '#333333',
toggleMenu: () => this.setState({ ov: ov === 'menu' ? 'none' : 'menu' }),
openRename: () => this.setState({ ov: 'rename' }),
close: () => this.setState({ ov: 'none' }),
opts: opts.map(([k, t], i) => ({ k, t, line: i ? '1px solid #333333' : '0' }))
};
}
}
</script>
</body>
</html>
