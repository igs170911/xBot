name: CI

on:
  push:
    branches: [ master, 'cursor/*' ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'
        
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Setup pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 9
        
    - name: Install dependencies
      run: make setup YES=1
      
    - name: Run make check
      run: make check
      
    - name: Upload test results
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          web/e2e-results/
          web/playwright-report/
        retention-days: 7

  docker-integration:
    name: Docker Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'
        
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Setup pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 9
        
    - name: Install dependencies
      run: make setup YES=1
      
    - name: Build xBot
      run: make build
      
    - name: Build bot computer image
      run: make box
      
    - name: Run Docker integration tests
      run: make e2e-docker
      
    - name: Upload docker test results
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: docker-test-results
        path: |
          web/e2e-results/
          web/playwright-report/
        retention-days: 7
